
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, sans-serif;
    background: #191919;
    color: white;
    overflow: hidden;
    user-select: none;
}

button {
    font-family: inherit;
}

.desktop {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: rgb(25,25,25);
    isolation: isolate;
}

/* WALLPAPER */

.wallpaper-layer {
    position: absolute;
    inset: -35px;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.wallpaper-layer video,
.wallpaper-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    filter: blur(var(--wallpaper-blur, 0px));
    transform: scale(1.02);
}

/* TASKBAR */

.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 15px;
    background: rgba(18,18,18,.80);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-top: 1px solid rgba(255,255,255,.06);
    z-index: 100;
}

.taskbar-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.settings-button {
    width: 37px;
    height: 37px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: background .15s;
}

.settings-button:hover {
    background: rgba(255,255,255,.13);
}

.clock {
    text-align: right;
    font-size: 12px;
    line-height: 17px;
    min-width: 80px;
}

.clock .time {
    font-size: 13px;
    font-weight: 600;
}

/* APPLICATION WINDOW */

.app-window {
    position: absolute;
    width: 720px;
    height: 550px;
    max-width: calc(100vw - 30px);
    max-height: calc(100dvh - 85px);

    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    display: none;
    flex-direction: column;

    background: rgba(27,27,27,.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px;
    overflow: hidden;

    box-shadow: 0 15px 60px rgba(0,0,0,.4);
    z-index: 50;

    transition:
        left .24s cubic-bezier(.2,.8,.2,1),
        top .24s cubic-bezier(.2,.8,.2,1),
        width .24s cubic-bezier(.2,.8,.2,1),
        height .24s cubic-bezier(.2,.8,.2,1),
        border-radius .24s ease,
        opacity .16s ease;
}

.app-window.open {
    display: flex;
    animation: windowOpen .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes windowOpen {
    from {
        opacity: 0;
        transform: translate(-50%, -47%) scale(.97);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* TITLEBAR */

.titlebar {
    height: 43px;
    min-height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.035);
    border-bottom: 1px solid rgba(255,255,255,.07);
    cursor: grab;
    touch-action: none;
}

.titlebar:active {
    cursor: grabbing;
}

.window-title {
    font-size: 12px;
    color: #ddd;
    padding-left: 16px;
    font-weight: 500;
    pointer-events: none;
}

.window-controls {
    display: flex;
    height: 100%;
    align-items: stretch;
}

.window-control {
    width: 44px;
    border: none;
    background: transparent;
    color: #ddd;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background .12s;
}

.window-control:hover {
    background: rgba(255,255,255,.12);
}

.window-control.close:hover {
    background: #c42b1c;
    color: white;
}

.maximize-icon {
    width: 10px;
    height: 10px;
    border: 1px solid currentColor;
}

.restore-icon {
    width: 11px;
    height: 10px;
    position: relative;
    border: 1px solid currentColor;
}

.restore-icon::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 7px;
    border: 1px solid currentColor;
    background: #292929;
    top: -4px;
    left: 3px;
}

/* SETTINGS */

.settings-body {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.sidebar {
    width: 190px;
    flex-shrink: 0;
    background: rgba(255,255,255,.025);
    padding: 25px 12px;
    border-right: 1px solid rgba(255,255,255,.07);
}

.sidebar h2 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 12px 25px;
}

.side-button {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #ccc;
    border: none;
    text-align: left;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
}

.side-button:hover,
.side-button.active {
    background: rgba(255,255,255,.1);
    color: white;
}

.settings-content {
    flex: 1;
    min-width: 0;
    padding: 27px;
    overflow-y: auto;
}

.settings-content::-webkit-scrollbar {
    width: 5px;
}

.settings-content::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 10px;
}

.settings-content h1 {
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 7px;
}

.subtitle {
    color: #999;
    font-size: 12px;
    margin-bottom: 25px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 11px;
}

/* COLOR */

.color-picker-container {
    display: flex;
    align-items: center;
    gap: 13px;
    background: rgba(255,255,255,.045);
    padding: 12px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.08);
}

.color-picker {
    width: 43px;
    height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
}

.color-value {
    color: #aaa;
    font-size: 12px;
}

/* BLUR */

.slider-container {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    padding: 15px;
    border-radius: 7px;
}

.slider-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.slider-label,
.slider-number {
    font-size: 12px;
    color: #ddd;
}

.slider-number {
    color: #aaa;
}

.blur-slider {
    width: 100%;
    height: 4px;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255,255,255,.2);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
}

.blur-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    border: 2px solid #aaa;
    cursor: pointer;
}

.blur-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    border: 2px solid #aaa;
    cursor: pointer;
}

/* WALLPAPERS */

.wallpaper-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 13px;
}

.wallpaper-card {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    background: #222;
    transition: border-color .15s, transform .15s;
}

.wallpaper-card:hover {
    border-color: rgba(255,255,255,.55);
    transform: translateY(-2px);
}

.wallpaper-card.selected {
    border: 2px solid #60a5fa;
}

.wallpaper-preview {
    width: 100%;
    height: 115px;
    object-fit: cover;
    display: block;
    background: #333;
}

.wallpaper-name {
    padding: 10px;
    font-size: 12px;
    color: #eee;
}

.preview-hint {
    font-size: 10px;
    color: #888;
    padding: 0 10px 9px;
}

/* MOBILE */

@media(max-width: 550px) {
    .sidebar {
        width: 120px;
        padding: 20px 7px;
    }

    .sidebar h2 {
        font-size: 16px;
        margin-left: 8px;
    }

    .settings-content {
        padding: 18px 12px;
    }

    .wallpaper-grid {
        grid-template-columns: 1fr;
    }

    .app-window {
        max-width: 100vw;
        max-height: calc(100dvh - 52px);
    }
}
</style>
</head>

<body>

<div class="desktop" id="desktop">

    <div class="wallpaper-layer" id="wallpaperLayer"></div>

    <div class="app-window" id="settingsWindow">

        <div class="titlebar" id="titlebar">

            <div class="window-title">Settings</div>

            <div class="window-controls">

                <button class="window-control" onclick="minimizeWindow()" title="Minimize">−</button>

                <button class="window-control" id="maximizeButton" onclick="maximizeWindow()" title="Maximize">
                    <span class="maximize-icon" id="maximizeIcon"></span>
                </button>

                <button class="window-control close" onclick="closeWindow()" title="Close">×</button>

            </div>
        </div>

        <div class="settings-body">

            <div class="sidebar">
                <h2>Settings</h2>
                <button class="side-button active">Wallpapers</button>
            </div>

            <div class="settings-content">

                <h1>Personalization</h1>
                <p class="subtitle">Customize your desktop appearance.</p>

                <div class="section">

                    <div class="section-title">Background color</div>

                    <div class="color-picker-container">

                        <input
                            type="color"
                            id="backgroundColor"
                            class="color-picker"
                            value="#191919"
                        >

                        <span class="color-value" id="colorValue">RGB(25, 25, 25)</span>

                    </div>
                </div>

                <div class="section">

                    <div class="section-title">Wallpaper effects</div>

                    <div class="slider-container">

                        <div class="slider-top">
                            <span class="slider-label">Background blur</span>
                            <span class="slider-number" id="blurValue">0%</span>
                        </div>

                        <input
                            type="range"
                            min="0"
                            max="100"
                            value="0"
                            id="blurSlider"
                            class="blur-slider"
                        >

                    </div>
                </div>

                <div class="section">

                    <div class="section-title">Wallpapers</div>

                    <div class="wallpaper-grid" id="wallpaperGrid">
                        Loading wallpapers...
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div class="taskbar">

        <div class="taskbar-right">

            <button class="settings-button" onclick="openSettings()" title="Settings">⚙</button>

            <div class="clock">
                <div class="time" id="time">00:00</div>
                <div id="date">00/00/0000</div>
            </div>

        </div>
    </div>

</div>

<script>

/* ELEMENTS */

const desktop = document.getElementById("desktop");
const wallpaperLayer = document.getElementById("wallpaperLayer");
const settingsWindow = document.getElementById("settingsWindow");
const titlebar = document.getElementById("titlebar");
const wallpaperGrid = document.getElementById("wallpaperGrid");

const colorPicker = document.getElementById("backgroundColor");
const blurSlider = document.getElementById("blurSlider");

let wallpapers = [];

let currentWallpaper = localStorage.getItem("desktopWallpaper") || "";
let currentColor = localStorage.getItem("desktopColor") || "#191919";
let currentBlur = Number(localStorage.getItem("desktopBlur") ?? 0);

let isMaximized = false;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let windowStartX = 0;
let windowStartY = 0;
let previousPosition = null;
let previewTimers = new Map();


/* CLOCK */

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString();
}

setInterval(updateClock, 1000);
updateClock();


/* WINDOW CONTROLS */

function openSettings() {
    settingsWindow.classList.add("open");

    if (isMaximized) {
        isMaximized = false;
        updateMaximizeIcon();
        settingsWindow.classList.remove("maximized");
    }

    settingsWindow.style.left = "50%";
    settingsWindow.style.top = "50%";
    settingsWindow.style.width = "720px";
    settingsWindow.style.height = "550px";
    settingsWindow.style.transform = "translate(-50%, -50%)";
}

function closeWindow() {
    settingsWindow.classList.remove("open");
    stopAllPreviews();
}

function minimizeWindow() {
    settingsWindow.classList.remove("open");
    stopAllPreviews();
}

function updateMaximizeIcon() {
    const icon = document.getElementById("maximizeIcon");

    icon.className = isMaximized ? "restore-icon" : "maximize-icon";
}

function maximizeWindow() {
    if (!isMaximized) {
        const rect = settingsWindow.getBoundingClientRect();

        previousPosition = {
            left: rect.left,
            top: rect.top,
            width: rect.width,
            height: rect.height
        };

        settingsWindow.style.transition = "none";
        settingsWindow.style.left = "0px";
        settingsWindow.style.top = "0px";
        settingsWindow.style.width = "100vw";
        settingsWindow.style.height = "calc(100dvh - 52px)";
        settingsWindow.style.transform = "none";
        settingsWindow.style.borderRadius = "0px";

        isMaximized = true;
    } else {
        if (!previousPosition) return;

        settingsWindow.style.left = previousPosition.left + "px";
        settingsWindow.style.top = previousPosition.top + "px";
        settingsWindow.style.width = previousPosition.width + "px";
        settingsWindow.style.height = previousPosition.height + "px";
        settingsWindow.style.transform = "none";
        settingsWindow.style.borderRadius = "9px";

        isMaximized = false;
    }

    updateMaximizeIcon();

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            settingsWindow.style.transition = "";
        });
    });
}


/* WINDOW DRAGGING */

titlebar.addEventListener("pointerdown", function(e) {
    if (e.target.closest(".window-controls")) return;
    if (isMaximized || e.button !== 0) return;

    const rect = settingsWindow.getBoundingClientRect();

    isDragging = true;

    dragStartX = e.clientX;
    dragStartY = e.clientY;

    windowStartX = rect.left;
    windowStartY = rect.top;

    settingsWindow.style.left = rect.left + "px";
    settingsWindow.style.top = rect.top + "px";
    settingsWindow.style.transform = "none";

    settingsWindow.style.transition = "none";

    titlebar.setPointerCapture(e.pointerId);
});

titlebar.addEventListener("pointermove", function(e) {
    if (!isDragging) return;

    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;

    const maxX = window.innerWidth - settingsWindow.offsetWidth;
    const maxY = window.innerHeight - 52 - 43;

    const x = Math.max(0, Math.min(maxX, windowStartX + dx));
    const y = Math.max(0, Math.min(maxY, windowStartY + dy));

    settingsWindow.style.left = x + "px";
    settingsWindow.style.top = y + "px";
});

function stopDragging() {
    if (!isDragging) return;

    isDragging = false;
    settingsWindow.style.transition = "";
}

titlebar.addEventListener("pointerup", stopDragging);
titlebar.addEventListener("pointercancel", stopDragging);


/* WALLPAPER HELPERS */

function getWallpaperName(filename) {
    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");
}

function getWallpaperPath(filename) {
    return "Wallpaper/" +
        filename.split("/").map(part => encodeURIComponent(part)).join("/");
}

function isVideo(filename) {
    return /\.(mp4|webm)$/i.test(filename);
}


/* DESKTOP WALLPAPER */

function setWallpaper(filename) {
    currentWallpaper = filename;

    wallpaperLayer.innerHTML = "";

    const wallpaper = document.createElement(
        isVideo(filename) ? "video" : "img"
    );

    wallpaper.src = getWallpaperPath(filename);

    if (isVideo(filename)) {
        wallpaper.autoplay = true;
        wallpaper.muted = true;
        wallpaper.loop = true;
        wallpaper.playsInline = true;
        wallpaper.play().catch(() => {});
    } else {
        wallpaper.alt = getWallpaperName(filename);
    }

    wallpaperLayer.appendChild(wallpaper);

    localStorage.setItem("desktopWallpaper", filename);

    renderWallpapers();
}


/* REMOVE WALLPAPER WHEN CHANGING COLOR */

function useSolidColor() {
    currentWallpaper = "";

    wallpaperLayer.innerHTML = "";

    localStorage.removeItem("desktopWallpaper");

    renderWallpapers();
}


/* COLOR */

function applyColor(color) {
    currentColor = color;

    desktop.style.backgroundColor = color;
    colorPicker.value = color;

    const r = parseInt(color.slice(1,3), 16);
    const g = parseInt(color.slice(3,5), 16);
    const b = parseInt(color.slice(5,7), 16);

    document.getElementById("colorValue").textContent =
        `RGB(${r}, ${g}, ${b})`;

    localStorage.setItem("desktopColor", color);
}

colorPicker.addEventListener("input", function() {
    applyColor(colorPicker.value);
    useSolidColor();
});


/* BLUR */

function applyBlur(value) {
    currentBlur = Number(value);

    const blurAmount = currentBlur * 0.3;

    wallpaperLayer.style.setProperty(
        "--wallpaper-blur",
        blurAmount + "px"
    );

    blurSlider.value = currentBlur;

    document.getElementById("blurValue").textContent =
        currentBlur + "%";

    localStorage.setItem("desktopBlur", currentBlur);
}

blurSlider.addEventListener("input", function() {
    applyBlur(blurSlider.value);
});


/* VIDEO PREVIEWS */

function stopPreview(video) {
    video.pause();
    video.currentTime = 0;
    video.removeAttribute("src");
    video.load();
}

function stopAllPreviews() {
    previewTimers.forEach(timer => clearTimeout(timer));
    previewTimers.clear();

    wallpaperGrid.querySelectorAll("video").forEach(video => {
        stopPreview(video);
    });
}

function createPreview(filename) {
    if (isVideo(filename)) {
        const video = document.createElement("video");

        video.className = "wallpaper-preview";
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "none";
        video.dataset.filename = filename;

        return video;
    }

    const image = document.createElement("img");

    image.className = "wallpaper-preview";
    image.src = getWallpaperPath(filename);
    image.alt = getWallpaperName(filename);

    return image;
}

function startPreview(video, filename) {
    if (!settingsWindow.classList.contains("open")) return;

    video.src = getWallpaperPath(filename);
    video.load();

    video.play().catch(() => {});
}

function addPreviewEvents(card, preview, filename) {
    if (!isVideo(filename)) return;

    card.addEventListener("mouseenter", function() {
        const timer = setTimeout(() => {
            startPreview(preview, filename);
            previewTimers.delete(preview);
        }, 500);

        previewTimers.set(preview, timer);
    });

    card.addEventListener("mouseleave", function() {
        const timer = previewTimers.get(preview);

        if (timer) {
            clearTimeout(timer);
            previewTimers.delete(preview);
        }

        stopPreview(preview);
    });
}


/* RENDER WALLPAPERS */

function renderWallpapers() {
    wallpaperGrid.innerHTML = "";

    wallpapers.forEach(filename => {
        const card = document.createElement("div");

        card.className = "wallpaper-card" +
            (currentWallpaper === filename ? " selected" : "");

        const preview = createPreview(filename);

        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = getWallpaperName(filename);

        card.append(preview, name);

        if (isVideo(filename)) {
            addPreviewEvents(card, preview, filename);
        }

        card.addEventListener("click", function() {
            setWallpaper(filename);
        });

        wallpaperGrid.appendChild(card);
    });
}


/* LOAD WALLPAPERS */

async function loadWallpapers() {
    try {
        const response = await fetch("wallpapers.json");

        if (!response.ok) {
            throw new Error("Could not load wallpapers.json");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Wallpaper list must be an array");
        }

        wallpapers = data.filter(filename =>
            typeof filename === "string" &&
            /\.(mp4|webm|jpg|jpeg|png|webp)$/i.test(filename)
        );

        if (!wallpapers.length) {
            wallpaperGrid.textContent = "No wallpapers found.";
            return;
        }

        if (!currentWallpaper || !wallpapers.includes(currentWallpaper)) {
            currentWallpaper = wallpapers.includes("Windows_11.jpg")
                ? "Windows_11.jpg"
                : wallpapers[0];
        }

        setWallpaper(currentWallpaper);

    } catch (error) {
        wallpaperGrid.textContent =
            "Unable to load wallpapers. Check wallpapers.json.";

        console.error(error);
    }
}


/* INITIAL SETTINGS */

applyColor(currentColor);
applyBlur(currentBlur);
loadWallpapers();

</script>

</body>
</html>
