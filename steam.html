<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam</title>
<style>
  :root {
    --bg: #1b2838;
    --bg-dark: #171a21;
    --panel: #16202d;
    --text: #c7d5e0;
    --muted: #8f98a0;
    --blue: #1a9fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Motiva Sans", "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* top bar */
  .topbar {
    height: 40px; background: var(--bg-dark);
    display: flex; align-items: center; padding: 0 16px; gap: 22px;
    flex-shrink: 0; border-bottom: 1px solid #000;
  }
  .brand { font-weight: 700; letter-spacing: 2px; color: #fff; font-size: 15px; }
  .nav { display: flex; gap: 18px; font-size: 13px; text-transform: uppercase; font-weight: 600; }
  .nav span { color: var(--muted); cursor: default; }
  .nav span.on { color: #fff; }

  .layout { flex: 1; display: flex; min-height: 0; }

  /* left sidebar: the game list */
  .sidebar {
    width: 250px; background: var(--panel); border-right: 1px solid #000;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .search {
    margin: 10px; padding: 7px 10px; background: #0e1722;
    border: 1px solid #2a475e; border-radius: 3px; color: var(--text);
    font-size: 13px; outline: none;
  }
  .search:focus { border-color: var(--blue); }
  .side-head { padding: 8px 12px 6px; font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .side-list { overflow-y: auto; flex: 1; padding-bottom: 8px; }
  .side-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; font-size: 14px; cursor: pointer; color: var(--muted);
    border-left: 3px solid transparent;
  }
  .side-item:hover { background: #22364b; color: #fff; }
  .side-item.selected { background: #2a475e; color: #fff; border-left-color: var(--blue); }
  .side-item img, .side-item .ph { width: 34px; height: 34px; border-radius: 6px; object-fit: contain; flex-shrink: 0; }
  .side-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, #2a475e, #1b2838);
  }

  /* main: the selected game's page */
  .main { flex: 1; overflow-y: auto; background: linear-gradient(180deg, #1b2838 0%, #14202e 100%); }

  .hero {
    position: relative; width: 100%; aspect-ratio: 16 / 7; max-height: 55vh;
    background: #0e1722; overflow: hidden;
  }
  .hero img.cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero.ph { font-size: 110px; }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: linear-gradient(transparent, #1b2838);
    pointer-events: none;
  }
  .hero-title {
    position: absolute; left: 28px; bottom: 16px; z-index: 2;
    font-size: 32px; font-weight: 600; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.85);
  }

  .actionbar {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 16px 28px; background: rgba(0,0,0,.22); border-bottom: 1px solid #0e1722;
  }
  .play {
    background: linear-gradient(90deg, #47bfff 5%, #1a44c2 95%);
    border: 0; color: #fff; font-size: 18px; font-weight: 600;
    padding: 12px 52px; border-radius: 3px; cursor: pointer; letter-spacing: .5px;
  }
  .play:hover { filter: brightness(1.15); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; user-select: none; }
  .check input { width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }
  .added { color: #5ba32b; font-size: 13px; }

  .details { padding: 20px 28px 30px; }
  .details h3 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .details p { color: var(--text); font-size: 14px; line-height: 1.6; max-width: 700px; }

  .empty { color: var(--muted); font-size: 14px; padding: 60px 28px; }

  /* game player */
  .player { position: fixed; inset: 0; z-index: 30; background: #000; display: none; flex-direction: column; }
  .player.open { display: flex; }
  .player-bar {
    height: 38px; background: var(--bg-dark); display: flex; align-items: center;
    justify-content: space-between; padding: 0 12px; font-size: 13px; flex-shrink: 0;
  }
  .player-bar button { background: #2a475e; color: #fff; border: 0; padding: 5px 14px; border-radius: 3px; cursor: pointer; }
  .player-bar button:hover { background: #3b6a8c; }
  .player iframe { flex: 1; border: 0; width: 100%; background: #000; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #0e1722; }
  ::-webkit-scrollbar-thumb { background: #2a475e; border-radius: 5px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">STEAM</div>
  <div class="nav"><span>Store</span><span class="on">Library</span><span>Community</span></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <input class="search" id="search" placeholder="Search games" autocomplete="off">
    <div class="side-head">All Games (<span id="count">0</span>)</div>
    <div class="side-list" id="sideList"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="empty">Select a game from the list.</div>

    <div id="gamePage" style="display:none">
      <div class="hero" id="hero">
        <div class="hero-title" id="pTitle"></div>
      </div>
      <div class="actionbar">
        <button class="play" id="playBtn">Play</button>
        <label class="check" id="checkWrap">
          <input type="checkbox" id="shortcutBox">
          Add Steam Shortcut to Desktop?
        </label>
        <span class="added" id="addedNote" style="display:none">Shortcut is on your desktop</span>
      </div>
      <div class="details" id="details">
        <h3>About this game</h3>
        <p id="pDesc"></p>
      </div>
    </div>
  </main>
</div>

<div class="player" id="player">
  <div class="player-bar"><span id="playerTitle"></span><button id="exitBtn">Exit game</button></div>
  <iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

<script>
/*
 * Beacon Steam
 * Games live in:   Games/<FolderName>/index.html
 * Covers:          Games/<FolderName>/small.(png|jpg|webp)   square logo (shown in the list)
 *                  Games/<FolderName>/big.(png|jpg|webp)     big cover (shown on the game page)
 * Optional:        Games/<FolderName>/info.json   { "title": "...", "description": "..." }
 * Manifest:        games.json  (list of folder names)
 */
window.BeaconSteam = window.BeaconSteam || {};

const GAMES_DIR   = "Games/";
const MANIFEST    = "games.json";
const SHORTCUT_KEY = "beacon_steam_shortcuts";
const EXTS = ["png", "jpg", "jpeg", "webp", "gif"];

let games = [];
let current = null;

const $ = id => document.getElementById(id);

function loadShortcuts() {
  try { return JSON.parse(localStorage.getItem(SHORTCUT_KEY)) || []; }
  catch (e) { return []; }
}
function saveShortcuts(list) {
  try { localStorage.setItem(SHORTCUT_KEY, JSON.stringify(list)); } catch (e) {}
}
function hasShortcut(id) { return loadShortcuts().some(s => s.id === id); }

function prettify(folder) {
  return folder.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
}

/* Try small.png, small.jpg, ... until one loads. */
function findImage(folder, base, cb) {
  let i = 0;
  const tryNext = () => {
    if (i >= EXTS.length) return cb(null);
    const url = GAMES_DIR + encodeURIComponent(folder) + "/" + base + "." + EXTS[i++];
    const img = new Image();
    img.onload = () => cb(url);
    img.onerror = tryNext;
    img.src = url;
  };
  tryNext();
}

function imgEl(url, cls) {
  const i = document.createElement("img");
  i.src = url; i.alt = ""; i.draggable = false;
  if (cls) i.className = cls;
  return i;
}

async function loadGame(folder) {
  const game = {
    id: folder,
    folder,
    title: prettify(folder),
    description: "",
    url: GAMES_DIR + encodeURIComponent(folder) + "/index.html",
    small: null,
    big: null
  };
  try {
    const r = await fetch(GAMES_DIR + encodeURIComponent(folder) + "/info.json", { cache: "no-cache" });
    if (r.ok) {
      const info = await r.json();
      if (info.title) game.title = info.title;
      if (info.description) game.description = info.description;
    }
  } catch (e) {}
  await new Promise(res => findImage(folder, "small", u => { game.small = u; res(); }));
  await new Promise(res => findImage(folder, "big",   u => { game.big = u;   res(); }));
  if (!game.small) game.small = game.big;
  if (!game.big) game.big = game.small;
  return game;
}

/* left list */
function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const list = games.filter(g => g.title.toLowerCase().includes(q));
  const side = $("sideList");
  side.innerHTML = "";
  $("count").textContent = list.length;

  list.forEach(g => {
    const row = document.createElement("div");
    row.className = "side-item" + (current && current.id === g.id ? " selected" : "");
    if (g.small) row.appendChild(imgEl(g.small));
    else {
      const ph = document.createElement("div");
      ph.className = "ph"; ph.textContent = g.title.charAt(0).toUpperCase();
      row.appendChild(ph);
    }
    const name = document.createElement("span");
    name.textContent = g.title;
    row.appendChild(name);
    row.onclick = () => showGame(g);
    side.appendChild(row);
  });
}

/* the game page: big cover, then Play + shortcut checkbox, then the description */
function showGame(g) {
  current = g;

  const hero = $("hero");
  hero.querySelectorAll("img.cover-img").forEach(n => n.remove());
  hero.classList.remove("ph");
  if (g.big) hero.insertBefore(imgEl(g.big, "cover-img"), hero.firstChild);
  else hero.classList.add("ph");

  $("pTitle").textContent = g.title;
  $("pDesc").textContent = g.description;
  $("details").style.display = g.description ? "block" : "none";

  const already = hasShortcut(g.id);
  $("shortcutBox").checked = false;                      // always starts blank
  $("checkWrap").style.display = already ? "none" : "flex";
  $("addedNote").style.display = already ? "inline" : "none";

  $("empty").style.display = "none";
  $("gamePage").style.display = "block";
  $("main").scrollTop = 0;
  renderList();
}

function addShortcut(g) {
  if (hasShortcut(g.id)) return;                         // only ever one per game
  const entry = { id: g.id, title: g.title, icon: g.small, url: g.url, folder: g.folder };
  const list = loadShortcuts();
  list.push(entry);
  saveShortcuts(list);
  if (typeof window.BeaconSteam.onShortcut === "function") window.BeaconSteam.onShortcut(entry);
  try { window.parent.postMessage({ type: "beacon-steam-shortcut", game: entry }, "*"); } catch (e) {}
}

function launch(g) {
  if (typeof window.BeaconSteam.onPlay === "function" && window.BeaconSteam.onPlay(g) === true) return;
  $("playerTitle").textContent = g.title;
  $("playerFrame").src = g.url;
  $("player").classList.add("open");
}

$("playBtn").onclick = () => {
  if (!current) return;
  const g = current;
  // the shortcut is only created now, when Play is clicked, and only if the box is checked
  if ($("shortcutBox").checked) {
    addShortcut(g);
    $("checkWrap").style.display = "none";
    $("addedNote").style.display = "inline";
  }
  launch(g);
};

$("exitBtn").onclick = () => { $("player").classList.remove("open"); $("playerFrame").src = "about:blank"; };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("player").classList.contains("open")) $("exitBtn").click();
});
$("search").addEventListener("input", renderList);

window.addEventListener("message", e => {
  if (e.data && e.data.type === "beacon-steam-play") {
    const g = games.find(x => x.id === e.data.id);
    if (g) launch(g);
  }
});

(async function init() {
  try {
    const r = await fetch(MANIFEST, { cache: "no-cache" });
    const folders = await r.json();
    games = await Promise.all(folders.map(loadGame));
    games.sort((a, b) => a.title.localeCompare(b.title));
  } catch (e) {
    console.error("Could not load games.json", e);
    games = [];
  }

  const play = new URLSearchParams(location.search).get("play");
  const toPlay = play ? games.find(x => x.id === play) : null;

  if (games.length) showGame(toPlay || games[0]);      // open the first game by default
  else { renderList(); $("empty").textContent = "No games yet."; }

  if (toPlay) launch(toPlay);
})();
</script>
</body>
</html>
