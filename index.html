
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Inter, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #111;
    color: white;
    user-select: none;
}

#wallpaper {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-color: #111;
    overflow: hidden;
}

#wallpaper video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#wallpaperBlur {
    position: fixed;
    inset: 0;
    z-index: 1;
    backdrop-filter: blur(0px);
    pointer-events: none;
}

.desktop {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
}

.desktop-icon {
    width: 90px;
    padding: 12px 5px;
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    border: 1px solid transparent;
    border-radius: 5px;
    cursor: pointer;
    touch-action: none;
}

.desktop-icon.dragging {
    z-index: 10;
    background: #ffffff20;
    border-color: #ffffff30;
}

#desktopApps {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

#desktopApps .desktop-icon {
    pointer-events: auto;
}

.desktop-icon:hover {
    background: #ffffff20;
    border-color: #ffffff20;
}

.desktop-icon img {
    width: 45px;
    height: 45px;
    object-fit: contain;
}

.desktop-icon span {
    font-size: 12px;
    text-shadow: 0 1px 4px #000;
}

.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    background: #171717e8;
    backdrop-filter: blur(25px);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 15px;
    gap: 15px;
    border-top: 1px solid #ffffff12;
}

.taskbar-button {
    height: 36px;
    min-width: 36px;
    padding: 0 9px;
    border: 0;
    background: transparent;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 19px;
}

.taskbar-button:hover {
    background: #ffffff18;
}

.clock {
    text-align: right;
    font-size: 12px;
    line-height: 17px;
    cursor: default;
}

.window {
    position: absolute;
    width: 760px;
    height: 520px;
    max-width: calc(100vw - 30px);
    max-height: calc(100vh - 75px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #191919;
    border: 1px solid #ffffff22;
    border-radius: 9px;
    box-shadow: 0 15px 55px #0008;
    overflow: hidden;
    display: none;
    flex-direction: column;
    z-index: 10;
}

.window.active {
    display: flex;
}

.window.maximized {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100% - 48px) !important;
    max-width: none;
    max-height: none;
    transform: none !important;
    border-radius: 0;
}

.titlebar {
    height: 42px;
    min-height: 42px;
    background: #202020;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 15px;
    border-bottom: 1px solid #ffffff0c;
    cursor: grab;
}

.titlebar:active {
    cursor: grabbing;
}

.window-title {
    font-size: 13px;
    font-weight: 500;
}

.window-controls {
    height: 100%;
    display: flex;
}

.window-controls button {
    width: 45px;
    height: 100%;
    border: 0;
    background: transparent;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.window-controls button:hover {
    background: #ffffff20;
}

.window-controls .close:hover {
    background: #c42b2b;
}

.window-content {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
}

.settings-content {
    padding: 25px;
    overflow-y: auto;
    display: block;
}

.section-title {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 8px;
}

.section-description {
    font-size: 13px;
    color: #999;
    margin-bottom: 25px;
}

.setting-section {
    margin-bottom: 30px;
}

.setting-section h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 1px solid #ffffff12;
}

.setting-row span {
    font-size: 13px;
    color: #ddd;
}

input[type="color"] {
    width: 45px;
    height: 30px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

input[type="range"] {
    width: 180px;
    accent-color: white;
    cursor: pointer;
}

.wallpaper-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}


.app-preview {
    width: 100%;
    height: 145px;
    background: #303030;
    overflow: hidden;
}

.app-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.app-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    min-width: 0;
}

.app-icon {
    width: 32px;
    height: 32px;
    object-fit: contain;
    flex-shrink: 0;
}

.app-heading .wallpaper-name {
    margin: 0;
}

.wallpaper-card {
    min-width: 0;
    background: #252525;
    border: 1px solid #ffffff12;
    border-radius: 7px;
    overflow: hidden;
}

.preview {
    width: 100%;
    height: 115px;
    background: #333;
    position: relative;
    overflow: hidden;
}

.preview img,
.preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.wallpaper-info {
    padding: 11px;
}

.wallpaper-name {
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 9px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.wallpaper-card button,
.install-button {
    width: 100%;
    height: 30px;
    border: 0;
    border-radius: 4px;
    background: #eee;
    color: #111;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

.wallpaper-card button:hover,
.install-button:hover {
    background: white;
}

.wallpaper-card button:disabled {
    opacity: .55;
    cursor: default;
}

.progress {
    width: 100%;
    height: 3px;
    background: #ffffff20;
    margin-top: 8px;
    overflow: hidden;
    display: none;
}

.progress-fill {
    width: 0;
    height: 100%;
    background: white;
}

.store-sidebar {
    width: 165px;
    min-width: 165px;
    background: #151515;
    border-right: 1px solid #ffffff12;
    padding: 20px 10px;
}

.sidebar-button {
    width: 100%;
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #aaa;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    margin-bottom: 5px;
}

.sidebar-button:hover {
    background: #ffffff0d;
    color: white;
}

.sidebar-button.selected {
    background: #ffffff16;
    color: white;
}

.store-main {
    flex: 1;
    min-width: 0;
    padding: 25px;
    overflow-y: auto;
}

.store-page-title {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 7px;
}

.store-page-description {
    font-size: 12px;
    color: #999;
    margin-bottom: 22px;
}

.empty-state {
    color: #777;
    font-size: 13px;
    padding-top: 20px;
}

@media (max-width: 600px) {
    .window {
        width: calc(100vw - 16px);
        height: calc(100vh - 65px);
    }

    .store-sidebar {
        width: 115px;
        min-width: 115px;
    }

    .store-main,
    .settings-content {
        padding: 15px;
    }

    .wallpaper-grid {
        grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    }
}
</style>
</head>

<body>

<div id="wallpaper"></div>
<div id="wallpaperBlur"></div>

<div class="desktop">

    <div class="desktop-icon" id="appStoreDesktopIcon" data-desktop-id="app-store">
        <img src="Resources/Icons/AppStore.png" alt="App Store">
        <span>App Store</span>
    </div>
    <div id="desktopApps"></div>

    <div class="taskbar">
        <button class="taskbar-button" onclick="openWindow('settingsWindow')" title="Settings">⚙</button>
        <div class="clock">
            <div id="clockTime"></div>
            <div id="clockDate"></div>
        </div>
    </div>

</div>

<div class="window" id="settingsWindow">
    <div class="titlebar">
        <span class="window-title">Settings</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('settingsWindow')">−</button>
            <button onclick="maximizeWindow('settingsWindow')">□</button>
            <button class="close" onclick="closeWindow('settingsWindow')">×</button>
        </div>
    </div>

    <div class="window-content settings-content">
        <div class="section-title">Settings</div>
        <div class="section-description">Personalize your desktop.</div>

        <div class="setting-section">
            <h3>Appearance</h3>

            <div class="setting-row">
                <span>Background color</span>
                <input type="color" id="backgroundColor" value="#202020">
            </div>

            <div class="setting-row">
                <span>Background blur</span>
                <input type="range" id="blurSlider" min="0" max="30" value="0">
            </div>
        </div>

        <div class="setting-section">
            <h3>Installed wallpapers</h3>
            <div class="wallpaper-grid" id="installedGrid"></div>
        </div>
    </div>
</div>

<div class="window" id="storeWindow">
    <div class="titlebar">
        <span class="window-title">App Store</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('storeWindow')">−</button>
            <button onclick="maximizeWindow('storeWindow')">□</button>
            <button class="close" onclick="closeWindow('storeWindow')">×</button>
        </div>
    </div>

    <div class="window-content">
        <div class="store-sidebar">
            <button class="sidebar-button selected" id="appsTab" onclick="showStoreTab('apps')">Apps</button>
            <button class="sidebar-button" id="wallpapersTab" onclick="showStoreTab('wallpapers')">Wallpapers</button>
        </div>

        <div class="store-main">
            <div id="appsPage">
                <div class="store-page-title">Apps</div>
                <div class="store-page-description">Browse and install apps for your desktop.</div>
                <div class="wallpaper-grid" id="appsGrid"></div>
            </div>

            <div id="wallpapersPage" style="display:none">
                <div class="store-page-title">Wallpapers</div>
                <div class="store-page-description">Browse and install wallpapers for your desktop.</div>
                <div class="wallpaper-grid" id="storeGrid"></div>
            </div>
        </div>
    </div>
</div>

<div class="window" id="moviumWindow">
    <div class="titlebar">
        <span class="window-title">Movium</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('moviumWindow')">−</button>
            <button onclick="maximizeWindow('moviumWindow')">□</button>
            <button class="close" onclick="closeWindow('moviumWindow')">×</button>
        </div>
    </div>
    <div class="window-content" style="display:block;background:#111">
        <iframe src="https://timmers437283.github.io/movium/" title="Movium" style="width:100%;height:100%;border:0;background:#111"></iframe>
    </div>
</div>

<script>
const wallpaperElement = document.getElementById("wallpaper");
const blurElement = document.getElementById("wallpaperBlur");

let wallpaperFiles = [];
let installedWallpapers = JSON.parse(localStorage.getItem("installedWallpapers") || "[]");
let installedApps = [];
try {
    installedApps = JSON.parse(localStorage.getItem("installedApps") || "[]");
    if (!Array.isArray(installedApps)) installedApps = [];
} catch (error) {
    installedApps = [];
}

const availableApps = [{
    id: "movium",
    name: "Movium",
    icon: "Resources/Icons/Movium.png",
    preview: "Resources/AppBase/Movium/Preview.png"
}];

let desktopIconPositions = {};
try {
    desktopIconPositions = JSON.parse(localStorage.getItem("desktopIconPositions") || "{}");
    if (!desktopIconPositions || typeof desktopIconPositions !== "object") desktopIconPositions = {};
} catch (error) {
    desktopIconPositions = {};
}

const defaultWallpaper = "Windows_11.jpg";

if (!installedWallpapers.includes(defaultWallpaper)) {
    installedWallpapers.push(defaultWallpaper);
    localStorage.setItem("installedWallpapers", JSON.stringify(installedWallpapers));
}

let currentWallpaper = localStorage.getItem("desktopWallpaper") || defaultWallpaper;
let currentColor = localStorage.getItem("desktopColor") || "#202020";
let currentBlur = localStorage.getItem("desktopBlur") || "0";

let highestWindow = 10;

/* CLOCK */

function updateClock() {
    const now = new Date();

    document.getElementById("clockTime").textContent =
        now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    document.getElementById("clockDate").textContent =
        now.toLocaleDateString([], { month: "numeric", day: "numeric", year: "numeric" });
}

updateClock();
setInterval(updateClock, 1000);

/* WALLPAPER */

function isVideo(filename) {
    return /\.(mp4|webm|ogg)$/i.test(filename);
}

function wallpaperPath(filename) {
    return "Wallpaper/" + encodeURIComponent(filename);
}

function applyColor() {
    wallpaperElement.innerHTML = "";
    wallpaperElement.style.backgroundImage = "none";
    wallpaperElement.style.backgroundColor = currentColor;
    document.getElementById("backgroundColor").value = currentColor;
}

function applyWallpaper(filename) {
    currentWallpaper = filename;
    localStorage.setItem("desktopWallpaper", filename);

    if (filename === "__solid__") {
        applyColor();
        return;
    }

    wallpaperElement.innerHTML = "";
    wallpaperElement.style.backgroundColor = "#111";

    if (isVideo(filename)) {
        const video = document.createElement("video");
        video.src = wallpaperPath(filename);
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "auto";
        wallpaperElement.appendChild(video);
        video.play().catch(() => {});
    } else {
        wallpaperElement.style.backgroundImage =
            `url("${wallpaperPath(filename)}")`;
    }
}

function useSolidColor() {
    currentWallpaper = "__solid__";
    localStorage.setItem("desktopWallpaper", "__solid__");
    wallpaperElement.innerHTML = "";
    wallpaperElement.style.backgroundImage = "none";
    wallpaperElement.style.backgroundColor = currentColor;
}

function applyBlur() {
    blurElement.style.backdropFilter = `blur(${currentBlur}px)`;
    document.getElementById("blurSlider").value = currentBlur;
}

document.getElementById("backgroundColor").addEventListener("input", event => {
    currentColor = event.target.value;
    localStorage.setItem("desktopColor", currentColor);
    useSolidColor();
});

document.getElementById("blurSlider").addEventListener("input", event => {
    currentBlur = event.target.value;
    localStorage.setItem("desktopBlur", currentBlur);
    applyBlur();
});

/* VIDEO PREVIEWS */

function createPreview(filename) {
    const preview = document.createElement("div");
    preview.className = "preview";

    if (isVideo(filename)) {
        const video = document.createElement("video");

        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.autoplay = false;
        video.preload = "auto";
        video.src = wallpaperPath(filename);

        video.load();

        video.addEventListener("loadeddata", () => {
            video.pause();
            video.currentTime = 0;
        }, { once: true });

        let hoverTimer;

        preview.addEventListener("mouseenter", () => {
            hoverTimer = setTimeout(() => {
                video.play().catch(() => {});
            }, 500);
        });

        preview.addEventListener("mouseleave", () => {
            clearTimeout(hoverTimer);
            video.pause();

            try {
                video.currentTime = 0;
            } catch (error) {}
        });

        preview.appendChild(video);
    } else {
        const image = document.createElement("img");
        image.src = wallpaperPath(filename);
        image.alt = filename;
        preview.appendChild(image);
    }

    return preview;
}

/* WALLPAPER NAMES */

function displayName(filename) {
    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");
}

/* INSTALLED WALLPAPERS */

function renderInstalled() {
    const grid = document.getElementById("installedGrid");
    grid.innerHTML = "";

    installedWallpapers.forEach(filename => {
        const card = document.createElement("div");
        card.className = "wallpaper-card";

        card.appendChild(createPreview(filename));

        const info = document.createElement("div");
        info.className = "wallpaper-info";

        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = displayName(filename);

        const button = document.createElement("button");

        if (currentWallpaper === filename) {
            button.textContent = "Currently selected";
            button.disabled = true;
        } else {
            button.textContent = "Use wallpaper";
            button.onclick = () => {
                applyWallpaper(filename);
                renderInstalled();
            };
        }

        info.append(name, button);
        card.appendChild(info);
        grid.appendChild(card);
    });
}

/* DESKTOP ICONS */

function saveDesktopIconPosition(id, icon) {
    desktopIconPositions[id] = {
        left: parseFloat(icon.style.left) || 20,
        top: parseFloat(icon.style.top) || 20
    };
    localStorage.setItem("desktopIconPositions", JSON.stringify(desktopIconPositions));
}

function makeDesktopIconDraggable(icon, id, defaultLeft, defaultTop, onOpen) {
    const saved = desktopIconPositions[id];
    icon.style.left = (saved && Number.isFinite(saved.left) ? saved.left : defaultLeft) + "px";
    icon.style.top = (saved && Number.isFinite(saved.top) ? saved.top : defaultTop) + "px";

    let startX = 0;
    let startY = 0;
    let startLeft = 0;
    let startTop = 0;
    let moved = false;

    icon.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        startX = event.clientX;
        startY = event.clientY;
        startLeft = parseFloat(icon.style.left) || 0;
        startTop = parseFloat(icon.style.top) || 0;
        moved = false;
        icon.setPointerCapture(event.pointerId);
    });

    icon.addEventListener("pointermove", event => {
        if (!icon.hasPointerCapture(event.pointerId)) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (!moved && Math.hypot(dx, dy) > 5) {
            moved = true;
            icon.classList.add("dragging");
        }
        if (!moved) return;

        const maxLeft = Math.max(0, window.innerWidth - icon.offsetWidth);
        const maxTop = Math.max(0, window.innerHeight - 48 - icon.offsetHeight);
        icon.style.left = Math.max(0, Math.min(maxLeft, startLeft + dx)) + "px";
        icon.style.top = Math.max(0, Math.min(maxTop, startTop + dy)) + "px";
    });

    icon.addEventListener("pointerup", event => {
        if (icon.hasPointerCapture(event.pointerId)) icon.releasePointerCapture(event.pointerId);
        icon.classList.remove("dragging");
        if (moved) {
            saveDesktopIconPosition(id, icon);
            icon.dataset.justDragged = "true";
            setTimeout(() => { icon.dataset.justDragged = "false"; }, 0);
        }
    });

    icon.addEventListener("click", event => {
        if (icon.dataset.justDragged === "true") {
            event.preventDefault();
            return;
        }
        if (onOpen) onOpen();
    });
}

function renderDesktopApps() {
    const container = document.getElementById("desktopApps");
    container.innerHTML = "";

    availableApps.forEach((app, index) => {
        if (!installedApps.includes(app.id)) return;

        const icon = document.createElement("div");
        icon.className = "desktop-icon";
        icon.title = "Double-click to open " + app.name;

        const image = document.createElement("img");
        image.src = app.icon;
        image.alt = app.name;

        const label = document.createElement("span");
        label.textContent = app.name;
        icon.append(image, label);
        container.appendChild(icon);

        makeDesktopIconDraggable(icon, app.id, 20, 125 + index * 100, () => openWindow("moviumWindow"));
    });
}

/* APP STORE */

function renderApps() {
    const grid = document.getElementById("appsGrid");
    grid.innerHTML = "";

    availableApps.forEach(app => {
        const installed = installedApps.includes(app.id);
        const card = document.createElement("div");
        card.className = "wallpaper-card";

        const preview = document.createElement("div");
        preview.className = "app-preview";
        const previewImage = document.createElement("img");
        previewImage.src = app.preview;
        previewImage.alt = app.name + " preview";
        previewImage.loading = "lazy";
        preview.appendChild(previewImage);

        const info = document.createElement("div");
        info.className = "wallpaper-info";
        const heading = document.createElement("div");
        heading.className = "app-heading";
        const appIcon = document.createElement("img");
        appIcon.className = "app-icon";
        appIcon.src = app.icon;
        appIcon.alt = "";
        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = app.name;
        heading.append(appIcon, name);

        const button = document.createElement("button");
        button.textContent = installed ? "Installed" : "Install";
        button.disabled = installed;
        const progress = document.createElement("div");
        progress.className = "progress";
        const fill = document.createElement("div");
        fill.className = "progress-fill";
        progress.appendChild(fill);

        button.onclick = () => {
            if (installedApps.includes(app.id)) return;
            button.disabled = true;
            button.textContent = "Installing...";
            progress.style.display = "block";
            const duration = 200 + Math.random() * 400;
            const start = performance.now();

            function animate(now) {
                const amount = Math.min((now - start) / duration, 1);
                fill.style.width = (amount * 100) + "%";
                if (amount < 1) {
                    requestAnimationFrame(animate);
                } else {
                    installedApps.push(app.id);
                    localStorage.setItem("installedApps", JSON.stringify(installedApps));
                    renderApps();
                    renderDesktopApps();
                }
            }
            requestAnimationFrame(animate);
        };

        info.append(heading, button, progress);
        card.append(preview, info);
        grid.appendChild(card);
    });
}

function renderStore() {
    const grid = document.getElementById("storeGrid");
    grid.innerHTML = "";

    wallpaperFiles.forEach(filename => {
        if (filename === defaultWallpaper) return;

        const installed = installedWallpapers.includes(filename);

        const card = document.createElement("div");
        card.className = "wallpaper-card";

        card.appendChild(createPreview(filename));

        const info = document.createElement("div");
        info.className = "wallpaper-info";

        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = displayName(filename);

        const button = document.createElement("button");
        button.textContent = installed ? "Installed" : "Install";
        button.disabled = installed;

        const progress = document.createElement("div");
        progress.className = "progress";

        const fill = document.createElement("div");
        fill.className = "progress-fill";
        progress.appendChild(fill);

        button.onclick = () => {
            if (installedWallpapers.includes(filename)) return;

            button.disabled = true;
            button.textContent = "Installing...";
            progress.style.display = "block";

            const duration = 200 + Math.random() * 400;
            const start = performance.now();

            function animateProgress(now) {
                const amount = Math.min((now - start) / duration, 1);
                fill.style.width = (amount * 100) + "%";

                if (amount < 1) {
                    requestAnimationFrame(animateProgress);
                } else {
                    installedWallpapers.push(filename);

                    localStorage.setItem(
                        "installedWallpapers",
                        JSON.stringify(installedWallpapers)
                    );

                    renderStore();
                    renderInstalled();
                }
            }

            requestAnimationFrame(animateProgress);
        };

        info.append(name, button, progress);
        card.appendChild(info);
        grid.appendChild(card);
    });
}

/* LOAD WALLPAPER LIST */

async function loadWallpapers() {
    try {
        const response = await fetch("wallpapers.json?v=" + Date.now(), {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Could not load wallpapers.json");
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
            throw new Error("wallpapers.json must contain an array");
        }

        wallpaperFiles = [...new Set(files)].filter(filename =>
            typeof filename === "string" &&
            /\.(jpg|jpeg|png|webp|mp4|webm|ogg)$/i.test(filename)
        );

        console.log("Loaded wallpapers:", wallpaperFiles);

        renderStore();
        renderInstalled();

    } catch (error) {
        console.error("Wallpaper loading failed:", error);

        document.getElementById("storeGrid").innerHTML =
            '<div class="empty-state">Could not load wallpapers.json.</div>';
    }
}

/* STORE TABS */

function showStoreTab(tab) {
    const apps = tab === "apps";

    document.getElementById("appsPage").style.display = apps ? "block" : "none";
    document.getElementById("wallpapersPage").style.display = apps ? "none" : "block";

    document.getElementById("appsTab").classList.toggle("selected", apps);
    document.getElementById("wallpapersTab").classList.toggle("selected", !apps);

    if (apps) renderApps();
    else renderStore();
}

/* WINDOWS */

let windowOpenCount = 0;

function openWindow(id) {
    const win = document.getElementById(id);
    if (!win) return;
    const wasOpen = win.classList.contains("active");
    win.classList.add("active");

    if (!wasOpen && !win.classList.contains("maximized")) {
        const offset = (windowOpenCount % 7) * 28;
        const rect = win.getBoundingClientRect();
        const width = rect.width || Math.min(760, window.innerWidth - 30);
        const height = rect.height || Math.min(520, window.innerHeight - 75);
        win.style.transform = "none";
        win.style.left = Math.max(10, Math.min((window.innerWidth - width) / 2 + offset, window.innerWidth - width - 10)) + "px";
        win.style.top = Math.max(10, Math.min((window.innerHeight - height) / 2 + offset, window.innerHeight - height - 58)) + "px";
        windowOpenCount++;
    }
    win.style.zIndex = ++highestWindow;
}

function closeWindow(id) {
    document.getElementById(id).classList.remove("active");
}

function minimizeWindow(id) {
    document.getElementById(id).classList.remove("active");
}

function maximizeWindow(id) {
    const win = document.getElementById(id);
    win.classList.toggle("maximized");
    win.style.zIndex = ++highestWindow;
}

/* WINDOW DRAGGING */

document.querySelectorAll(".window").forEach(win => {
    const titlebar = win.querySelector(".titlebar");
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    titlebar.addEventListener("pointerdown", event => {
        if (event.target.closest(".window-controls")) return;
        if (win.classList.contains("maximized")) return;

        dragging = true;
        win.style.zIndex = ++highestWindow;

        const rect = win.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        win.style.transform = "none";
        win.style.left = rect.left + "px";
        win.style.top = rect.top + "px";

        titlebar.setPointerCapture(event.pointerId);
    });

    titlebar.addEventListener("pointermove", event => {
        if (!dragging) return;

        let x = event.clientX - offsetX;
        let y = event.clientY - offsetY;

        x = Math.max(0, Math.min(x, window.innerWidth - win.offsetWidth));
        y = Math.max(0, Math.min(y, window.innerHeight - 80));

        win.style.left = x + "px";
        win.style.top = y + "px";
    });

    titlebar.addEventListener("pointerup", () => {
        dragging = false;
    });

    titlebar.addEventListener("pointercancel", () => {
        dragging = false;
    });
});

/* INITIALIZE */

const appStoreIcon = document.getElementById("appStoreDesktopIcon");
makeDesktopIconDraggable(appStoreIcon, "app-store", 20, 20, () => openWindow("storeWindow"));
renderApps();
renderDesktopApps();
applyBlur();

if (currentWallpaper === "__solid__") {
    applyColor();
} else {
    if (!installedWallpapers.includes(currentWallpaper)) {
        currentWallpaper = defaultWallpaper;
    }

    applyWallpaper(currentWallpaper);
}

loadWallpapers();
</script>
