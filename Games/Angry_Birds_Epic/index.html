(function () {
	var BAD = new RegExp("(^|\\.)(" + ["r9x.in","doubleclick.net","googlesyndication.com","googletagservices.com","googletagmanager.com","google-analytics.com","adtrafficquality.google","fundingchoicesmessages.google.com","imasdk.googleapis.com","cloudflareinsights.com","clarity.ms","hotjar.com","railway.app","adinplay.com","pubmatic.com","rubiconproject.com","adnxs.com","amazon-adsystem.com","criteo.com","taboola.com","outbrain.com","moatads.com","scorecardresearch.com","sentry.io","mixpanel.com","amplitude.com"].join("|").replace(/\./g, "\\.") + ")$", "i"); // the server fills in the host list (adhosts.js)
	function bad(u) {
		try {
			return BAD.test(new URL(String(u), location.href).hostname);
		} catch (e) {
			return false;
		}
	}
	function blocked(el) {
		// let the page carry on as if the load had simply failed
		setTimeout(function () {
			try {
				el.dispatchEvent(new Event("error"));
			} catch (e) {}
		}, 0);
	}
	function patchSrc(proto) {
		var d = Object.getOwnPropertyDescriptor(proto, "src");
		if (!d || !d.set) return;
		Object.defineProperty(proto, "src", {
			configurable: true,
			enumerable: d.enumerable,
			get: d.get,
			set: function (v) {
				if (bad(v)) return blocked(this);
				d.set.call(this, v);
			},
		});
	}
	patchSrc(HTMLScriptElement.prototype);
	patchSrc(HTMLIFrameElement.prototype);
	patchSrc(HTMLImageElement.prototype);
	var setAttr = Element.prototype.setAttribute;
	Element.prototype.setAttribute = function (n, v) {
		if (/^src$/i.test(n) && /^(script|iframe|img)$/i.test(this.tagName) && bad(v)) return blocked(this);
		return setAttr.apply(this, arguments);
	};
	if (window.fetch) {
		var f = window.fetch;
		window.fetch = function (r) {
			if (bad(r && r.url ? r.url : r)) return Promise.reject(new TypeError("Failed to fetch"));
			return f.apply(this, arguments);
		};
	}
	var open = XMLHttpRequest.prototype.open;
	XMLHttpRequest.prototype.open = function (m, u) {
		if (bad(u)) arguments[1] = "about:blank";
		return open.apply(this, arguments);
	};
	if (window.WebSocket) {
		var WS = window.WebSocket;
		var Guarded = function (u, p) {
			if (bad(u)) throw new DOMException("The connection was refused.", "SecurityError");
			return arguments.length > 1 ? new WS(u, p) : new WS(u);
		};
		Guarded.prototype = WS.prototype;
		["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) {
			Guarded[k] = WS[k];
		});
		window.WebSocket = Guarded;
	}
	if (navigator.sendBeacon) {
		var sb = navigator.sendBeacon;
		navigator.sendBeacon = function (u) {
			return bad(u) ? false : sb.apply(this, arguments);
		};
	}
})();

    <meta charset="utf-8">

    <style>
      /* Hide Unity's default loading bar; the custom loader replaces it */
      #unity-loading-bar { display: none !important; }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #loader img {
        width: min(420px, 80vw);
        height: auto;
        margin-bottom: 32px;
      }
      #loader .line {
        width: min(420px, 80vw);
        height: 4px;
        background: #222;
      }
      #loader .fill {
        width: 0%;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <img src="https://upload.wikimedia.org/wikipedia/fr/b/bf/Angry_Birds_Epic_Logo.png" alt="Angry Birds Epic">
      <div class="line"><div class="fill" id="fill"></div></div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

      <script>
      const loaderEl = document.querySelector("#loader");
      const fillEl = document.querySelector("#fill");

      let totalBytes = 174160000.0;
      let loadedBytes = 0;
      let downloadDone = false;
      let unityProgress = 0;

      // overall = download (0..90%) + engine startup (90..100%)
      function render() {
        if (!loaderEl.isConnected) return;
        const dl = Math.min(loadedBytes / totalBytes, 1);
        const p = (downloadDone ? 0.9 + unityProgress * 0.1 : dl * 0.9) * 100;
        fillEl.style.width = p.toFixed(2) + "%";
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }
      async function mergeFiles(parts) {
        const buffers = await Promise.all(parts.map(fetchWithProgress));
        return URL.createObjectURL(new Blob(buffers));
      }

      function getParts(file, count) {
        let parts = [];
        for (let i = 1; i <= count; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }
      (async () => {
        const dataParts = getParts("https://fastly.jsdelivr.net/gh/iamthegamesofsprunk/EpicWeb@main/Build/EpicWeb.data", 7);
        const wasmParts = getParts("https://fastly.jsdelivr.net/gh/iamthegamesofsprunk/EpicWeb@main/Build/EpicWeb.wasm", 2);
        const allParts = [...dataParts, ...wasmParts];
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(dataParts),
          mergeFiles(wasmParts),
        ]);
        downloadDone = true;
        loadedBytes = totalBytes;

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector(
          "#unity-progress-bar-full"
        );
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {}

      var buildUrl = "https://fastly.jsdelivr.net/gh/iamthegamesofsprunk/EpicWeb@master/Build/";
      var loaderUrl = buildUrl + "EpicWeb.loader.js";
      var config = {
        dataUrl: dataUrl,
        frameworkUrl: buildUrl + "EpicWeb.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "https://fastly.jsdelivr.net/gh/iamthegamesofsprunk/EpicWeb@master/StreamingAssets/",
        companyName: "Rovio Entertainment Ltd.",
        productName: "Epic",
        productVersion: "3.0.1",
        showBanner: unityShowBanner,
      };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Mobile device style: fill the whole browser client area with the game canvas:
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            unityProgress = progress;
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loaderEl.remove();
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
