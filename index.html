
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, sans-serif;
    overflow: hidden;
    background: rgb(25,25,25);
    color: white;
    user-select: none;
}

.desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: rgb(25,25,25);
    overflow: hidden;
}

#wallpaperVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    display: none;
}

.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 52px;
    background: rgba(20,20,20,.85);
    backdrop-filter: blur(25px);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 14px;
    gap: 18px;
    border-top: 1px solid rgba(255,255,255,.08);
    z-index: 5;
}

.taskbar-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.clock {
    text-align: right;
    font-size: 12px;
    line-height: 18px;
}

.clock .time {
    font-weight: 600;
    font-size: 13px;
}

.settings-button {
    width: 37px;
    height: 37px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.settings-button:hover {
    background: rgba(255,255,255,.13);
}

.settings-window {
    display: none;
    position: absolute;
    right: 16px;
    bottom: 65px;
    width: min(650px,calc(100vw - 32px));
    height: min(500px,calc(100vh - 90px));
    background: rgba(27,27,27,.96);
    backdrop-filter: blur(35px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 15px 60px rgba(0,0,0,.4);
    z-index: 10;
}

.settings-window.open {
    display: flex;
    animation: appear .18s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.sidebar {
    width: 190px;
    background: rgba(255,255,255,.035);
    padding: 25px 12px;
    border-right: 1px solid rgba(255,255,255,.07);
    flex-shrink: 0;
}

.sidebar h2 {
    font-size: 19px;
    margin: 0 12px 25px;
    font-weight: 600;
}

.side-button {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #ddd;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
}

.side-button:hover,
.side-button.active {
    background: rgba(255,255,255,.1);
    color: white;
}

.settings-content {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
    min-width: 0;
    position: relative;
}

.settings-content h1 {
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 8px;
}

.subtitle {
    color: #999;
    font-size: 12px;
    margin-bottom: 22px;
}

.close-button {
    position: absolute;
    top: 12px;
    right: 14px;
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
}

.close-button:hover {
    color: white;
}

.color-section {
    margin-bottom: 25px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 11px;
}

.color-picker-container {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,.05);
    padding: 12px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.08);
}

.color-picker {
    width: 42px;
    height: 32px;
    border: none;
    background: none;
    cursor: pointer;
}

.color-value {
    color: #aaa;
    font-size: 12px;
}

.wallpaper-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 14px;
}

.wallpaper-card {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    background: #222;
    transition: .15s;
}

.wallpaper-card:hover {
    border-color: rgba(255,255,255,.6);
    transform: translateY(-2px);
}

.wallpaper-card.selected {
    border: 2px solid #60a5fa;
}

.wallpaper-card video {
    width: 100%;
    height: 105px;
    display: block;
    object-fit: cover;
    background: #333;
}

.wallpaper-name {
    padding: 10px;
    font-size: 12px;
    color: #eee;
}

@media(max-width:500px) {
    .sidebar {
        width: 125px;
    }

    .settings-content {
        padding: 20px 12px;
    }

    .wallpaper-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="desktop" id="desktop">

    <video id="wallpaperVideo" autoplay muted loop playsinline></video>

    <div class="settings-window" id="settingsWindow">

        <div class="sidebar">
            <h2>Settings</h2>
            <button class="side-button active">Wallpapers</button>
        </div>

        <div class="settings-content">

            <button class="close-button" onclick="toggleSettings()">×</button>

            <h1>Personalization</h1>
            <p class="subtitle">Customize your desktop appearance.</p>

            <div class="color-section">
                <div class="section-title">Background color</div>

                <div class="color-picker-container">
                    <input
                        type="color"
                        class="color-picker"
                        id="backgroundColor"
                        value="#191919"
                    >

                    <span class="color-value" id="colorValue">
                        RGB(25, 25, 25)
                    </span>
                </div>
            </div>

            <div class="section-title">Animated wallpapers</div>

            <div class="wallpaper-grid" id="wallpaperGrid">
                Loading wallpapers...
            </div>

        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-right">

            <button class="settings-button" onclick="toggleSettings()" title="Settings">
                ⚙
            </button>

            <div class="clock">
                <div class="time" id="time">00:00</div>
                <div id="date">00/00/0000</div>
            </div>

        </div>
    </div>

</div>

<script>
const desktop = document.getElementById("desktop");
const video = document.getElementById("wallpaperVideo");
const settingsWindow = document.getElementById("settingsWindow");
const wallpaperGrid = document.getElementById("wallpaperGrid");
const colorPicker = document.getElementById("backgroundColor");

let wallpapers = [];
let currentWallpaper = localStorage.getItem("desktopWallpaper") || "";
let currentColor = localStorage.getItem("desktopColor") || "#191919";

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString();
}

setInterval(updateClock, 1000);
updateClock();

function toggleSettings() {
    settingsWindow.classList.toggle("open");
}

function getWallpaperName(filename) {
    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");
}

function applyColor(color) {
    currentColor = color;

    desktop.style.backgroundColor = color;
    colorPicker.value = color;

    const r = parseInt(color.slice(1,3),16);
    const g = parseInt(color.slice(3,5),16);
    const b = parseInt(color.slice(5,7),16);

    document.getElementById("colorValue").textContent =
        `RGB(${r}, ${g}, ${b})`;

    localStorage.setItem("desktopColor", color);
}

colorPicker.addEventListener("input", () => {
    applyColor(colorPicker.value);
});

function setWallpaper(filename) {
    currentWallpaper = filename;

    video.src = "Wallpaper/" + encodeURIComponent(filename);
    video.style.display = "block";

    video.load();

    video.play().catch(() => {});

    localStorage.setItem("desktopWallpaper", filename);

    renderWallpapers();
}

function removeWallpaper() {
    currentWallpaper = "";
    video.pause();
    video.removeAttribute("src");
    video.load();
    video.style.display = "none";

    localStorage.removeItem("desktopWallpaper");

    renderWallpapers();
}

function renderWallpapers() {
    wallpaperGrid.innerHTML = "";

    wallpapers.forEach(filename => {
        const card = document.createElement("div");

        card.className = "wallpaper-card" +
            (currentWallpaper === filename ? " selected" : "");

        const preview = document.createElement("video");
        preview.src = "Wallpaper/" + encodeURIComponent(filename);
        preview.muted = true;
        preview.loop = true;
        preview.autoplay = true;
        preview.playsInline = true;
        preview.preload = "metadata";

        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = getWallpaperName(filename);

        card.append(preview, name);
        card.onclick = () => setWallpaper(filename);

        wallpaperGrid.appendChild(card);
    });
}

async function loadWallpapers() {
    try {
        const response = await fetch("wallpapers.json");

        if (!response.ok) throw new Error("Could not load wallpapers");

        wallpapers = await response.json();

        if (!wallpapers.length) {
            wallpaperGrid.textContent = "No wallpapers found.";
            return;
        }

        if (!wallpapers.includes(currentWallpaper)) {
            currentWallpaper = wallpapers[0];
        }

        applyColor(currentColor);

        if (currentWallpaper) {
            setWallpaper(currentWallpaper);
        }

        renderWallpapers();

    } catch (error) {
        wallpaperGrid.textContent =
            "Could not load wallpapers. Check wallpapers.json.";
        console.error(error);
    }
}

applyColor(currentColor);
loadWallpapers();
</script>

</body>
</html>
