<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ㅤ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
:root{--tb-h:56px}
body{width:100vw;height:100vh;overflow:hidden;background:#111;color:#fff;user-select:none}
#wallpaper{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-color:#111;overflow:hidden}
#wallpaper video{width:100%;height:100%;object-fit:cover}
#wallpaperBlur{position:fixed;inset:0;z-index:1;pointer-events:none}
#snowFx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#dayLabel{position:fixed;top:18px;left:0;width:100%;text-align:center;z-index:3;pointer-events:none;font-size:30px;font-weight:700;letter-spacing:.35em;text-indent:.35em;color:rgba(255,255,255,.85);text-shadow:0 2px 14px #0006}
.desktop{position:relative;z-index:auto;width:100%;height:100%}

/* TASKBAR */
.taskbar{position:fixed;bottom:0;left:0;width:100%;height:var(--tb-h);background:rgba(23,23,23,.35);backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 8px;border-top:1px solid #ffffff12;z-index:50000}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;height:100%;align-items:center}
.tb-btn{position:relative;width:calc(var(--tb-h) - 6px);height:calc(var(--tb-h) - 10px);border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb-btn:hover,.tb-btn.selected{background:#ffffff18}
.tb-btn img{width:82%;height:82%;object-fit:contain;transition:transform .15s ease}
.tb-btn:hover img,.tb-btn:hover svg{transform:scale(1.25)}
.tb-btn svg{transition:transform .15s ease}
.tb-btn.bounce{animation:tbBounce .45s ease}
@keyframes tbBounce{0%{transform:scale(1)}35%{transform:scale(1.4)}70%{transform:scale(.88)}100%{transform:scale(1)}}
.tb-resize{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;touch-action:none;z-index:2}
.tb-btn svg{width:44%;height:44%}
.tb-btn.running::after{content:"";position:absolute;bottom:2px;left:50%;width:12px;height:3px;margin-left:-6px;border-radius:3px;background:#75a9ff}
.clock{text-align:right;font-size:12px;line-height:17px;cursor:pointer;padding:5px 8px;border-radius:5px}
.clock:hover,.clock.selected{background:#ffffff18}

/* START MENU */
#startMenu{position:fixed;z-index:50001;left:12px;bottom:calc(var(--tb-h) + 10px);width:400px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--tb-h) - 27px);overflow-y:auto;padding:20px;border:1px solid #ffffff20;border-radius:10px;background:rgba(25,25,25,.22);backdrop-filter:blur(25px);box-shadow:0 15px 50px #0009;display:none}
#startMenu.open{display:block;animation:panelIn .15s ease}
.start-title{font-size:13px;font-weight:600;margin-bottom:14px}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.start-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:6px;cursor:pointer;font-size:11px;text-align:center}
.start-item:hover{background:#ffffff18}
.start-item img{width:36px;height:36px;object-fit:contain}

/* WINDOWS */
.window{position:absolute;width:760px;height:520px;max-width:calc(100vw - 30px);max-height:calc(100vh - 75px);top:50%;left:50%;transform:translate(-50%,-50%);background:#191919;border:1px solid #ffffff22;border-radius:9px;box-shadow:0 15px 55px #0008;overflow:hidden;display:none;flex-direction:column;z-index:10}
.window.active{display:flex}
.window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - var(--tb-h))!important;max-width:none;max-height:none;transform:none!important;border-radius:0}
.titlebar{height:42px;min-height:42px;background:#202020;display:flex;align-items:center;justify-content:space-between;padding-left:15px;border-bottom:1px solid #ffffff0c;cursor:grab}
.titlebar:active{cursor:grabbing}
.window-title{font-size:13px;font-weight:500}
.window-controls{position:relative;z-index:31;height:100%;display:flex}
.window-controls button{width:45px;height:100%;border:0;background:transparent;color:#fff;font-size:14px;cursor:pointer}
.window-controls button:hover{background:#ffffff20}
.window-controls .close:hover{background:#c42b2b}
.window-content{flex:1;min-height:0;display:flex;overflow:hidden}
.window-content iframe{width:100%;height:100%;border:0;background:#111}
.settings-content{padding:25px;overflow-y:auto;display:block}
.section-title,.store-page-title{font-size:21px;font-weight:600;margin-bottom:8px}
.section-description,.store-page-description{font-size:13px;color:#999;margin-bottom:25px}
.setting-section{margin-bottom:30px}
.setting-section h3{font-size:14px;font-weight:600;margin-bottom:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #ffffff12}
.setting-row span{font-size:13px;color:#ddd}
input[type=color]{width:45px;height:30px;border:0;background:transparent;cursor:pointer}
input[type=range]{width:180px;accent-color:#fff;cursor:pointer}
.window-edge{position:absolute;z-index:30;touch-action:none}
.window-edge.left,.window-edge.right{top:8px;bottom:8px;width:6px;cursor:ew-resize}
.window-edge.top,.window-edge.bottom{left:8px;right:8px;height:6px;cursor:ns-resize}
.window-edge.left{left:0}.window-edge.right{right:0}.window-edge.top{top:0}.window-edge.bottom{bottom:0}
.window-edge.top-left,.window-edge.top-right,.window-edge.bottom-left,.window-edge.bottom-right{width:13px;height:13px}
.window-edge.top-left{top:0;left:0;cursor:nwse-resize}
.window-edge.top-right{top:0;right:0;cursor:nesw-resize}
.window-edge.bottom-left{bottom:0;left:0;cursor:nesw-resize}
.window-edge.bottom-right{bottom:0;right:0;cursor:nwse-resize}
.window.maximized .window-edge{display:none}

/* STORE */
.wallpaper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}
.wallpaper-card{min-width:0;background:#252525;border:1px solid #ffffff12;border-radius:7px;overflow:hidden}
.preview{width:100%;height:115px;background:#333;position:relative;overflow:hidden}
.preview.app{height:145px;background:#303030}
.preview img,.preview video{width:100%;height:100%;object-fit:cover;display:block}
.wallpaper-info{padding:11px}
.app-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.app-icon{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.wallpaper-name{font-size:12px;font-weight:500;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-heading .wallpaper-name{margin:0}
.wallpaper-card button{width:100%;height:30px;border:0;border-radius:4px;background:#eee;color:#111;font-size:11px;font-weight:600;cursor:pointer}
.wallpaper-card button:hover{background:#fff}
.wallpaper-card button:disabled{opacity:.55;cursor:default}
.progress{width:100%;height:3px;background:#ffffff20;margin-top:8px;overflow:hidden;display:none}
.progress-fill{width:0;height:100%;background:#fff}
.store-sidebar{width:165px;min-width:165px;background:#151515;border-right:1px solid #ffffff12;padding:20px 10px}
.sidebar-button{width:100%;height:38px;display:flex;align-items:center;padding:0 12px;border:0;border-radius:5px;background:transparent;color:#aaa;font-size:13px;text-align:left;cursor:pointer;margin-bottom:5px}
.sidebar-button:hover{background:#ffffff0d;color:#fff}
.sidebar-button.selected{background:#ffffff16;color:#fff}
.store-main{flex:1;min-width:0;padding:25px;overflow-y:auto}
.store-page-title{margin-bottom:7px}
.store-page-description{font-size:12px;margin-bottom:22px}
.empty-state{color:#777;font-size:13px;padding-top:20px}

/* DATE + WEATHER PANEL */
#calendarPanel{position:fixed;z-index:50001;right:12px;bottom:calc(var(--tb-h) + 10px);width:365px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--tb-h) - 27px);overflow-y:auto;padding:20px;border:1px solid #ffffff20;border-radius:10px;background:rgba(25,25,25,.78);backdrop-filter:blur(25px);box-shadow:0 15px 50px #0009;display:none}
#calendarPanel.open{display:block;animation:panelIn .15s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.calendar-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.calendar-time{font-size:32px;font-weight:600;letter-spacing:-1px}
.calendar-full-date{color:#aaa;font-size:12px;margin-top:4px}
.calendar-close{border:0;background:transparent;color:#aaa;font-size:22px;cursor:pointer;padding:0 5px}
.calendar-close:hover{color:#fff}
.weather-section{background:#ffffff09;border:1px solid #ffffff10;border-radius:8px;padding:14px}
.weather-top{display:flex;justify-content:space-between;align-items:center}
.weather-temperature{font-size:37px;font-weight:600}
.weather-description{font-size:12px;color:#ddd;margin-top:2px}
.weather-location{color:#888;font-size:11px;margin-top:5px}
.weather-icon{font-size:40px;padding-right:5px}
.weather-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px;padding-top:13px;border-top:1px solid #ffffff12}
.weather-details div{display:flex;flex-direction:column;gap:5px}
.weather-details span{font-size:10px;color:#888}
.weather-details strong{font-size:12px;font-weight:500}
.weather-location-controls{display:flex;gap:6px;margin-top:15px}
.weather-location-controls input{min-width:0;flex:1;height:31px;padding:0 9px;border:1px solid #ffffff20;border-radius:4px;outline:none;background:#111;color:#fff;font-size:11px;user-select:text}
.weather-location-controls input:focus{border-color:#888}
.weather-location-controls button{height:31px;min-width:34px;padding:0 9px;border:0;border-radius:4px;background:#eee;color:#111;font-size:11px;cursor:pointer}
.weather-location-controls button:hover{background:#fff}
.weather-credit{margin-top:10px;color:#666;font-size:9px}
.weather-credit a{color:#999;text-decoration:none}
.weather-credit a:hover{color:#fff}
.calendar-divider{height:1px;background:#ffffff16;margin:17px 0}
.calendar-navigation{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.calendar-month{font-size:14px;font-weight:600}
.calendar-arrows{display:flex;gap:5px}
.calendar-arrows button{width:27px;height:27px;border:0;border-radius:4px;background:#ffffff10;color:#fff;font-size:19px;cursor:pointer}
.calendar-arrows button:hover{background:#ffffff25}
.calendar-weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.calendar-weekdays{margin-bottom:7px}
.calendar-weekdays span{color:#777;font-size:10px;padding:5px 0}
.calendar-day{height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:5px;cursor:pointer;font-size:11px}
.calendar-day:hover{background:#ffffff18}
.calendar-day.other-month{color:#555}
.calendar-day.today{border:1px solid #777}
.calendar-day.selected{background:#eee;color:#111}
.holiday-dot{width:4px;height:4px;border-radius:50%;background:#75a9ff}
.calendar-day.selected .holiday-dot{background:#397bd8}
.calendar-event-heading{font-size:12px;font-weight:600;margin-bottom:10px}
.calendar-event{display:flex;align-items:center;gap:10px;padding:9px 0}
.event-marker{width:3px;height:29px;border-radius:3px;background:#75a9ff;flex-shrink:0}
.event-name{font-size:11px;font-weight:500}
.event-description{font-size:10px;color:#888;margin-top:3px}
.no-events{font-size:11px;color:#777;padding:5px 0}

/* ANNOUNCEMENT */
#announcement{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;background:#0009;backdrop-filter:blur(6px);animation:fadeIn .3s ease;transition:opacity .5s ease}
#announcement.hide{opacity:0;pointer-events:none}
.announce-card{width:380px;max-width:100%;padding:26px;border:1px solid #ffffff20;border-radius:12px;background:#191919;box-shadow:0 20px 60px #000a;animation:cardIn .35s cubic-bezier(.2,.9,.3,1.2)}
.announce-card h2{font-size:20px;font-weight:600;margin-bottom:10px}
.announce-card p{font-size:14px;line-height:1.5;color:#bbb;margin-bottom:22px}
#ackBtn{position:relative;width:100%;height:40px;border:0;border-radius:6px;background:#eee;color:#111;font-size:13px;font-weight:600;cursor:pointer;overflow:hidden;transition:background .2s}
#ackBtn:hover{background:#fff}
#ackBtn .label{display:inline-block;transition:transform .3s ease,opacity .3s ease}
#ackBtn svg{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0}
#ackBtn.done{pointer-events:none;background:#4caf6e}
#ackBtn.done .label{transform:scaleX(0);opacity:0}
#ackBtn.done svg{animation:checkBounce .6s .25s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes checkBounce{0%{opacity:0;transform:translateY(18px) scale(.4)}60%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:1;transform:none}}

@media(max-width:600px){
.window{width:calc(100vw - 16px);height:calc(100vh - 65px)}
.store-sidebar{width:115px;min-width:115px}
.store-main,.settings-content{padding:15px}
.wallpaper-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
#calendarPanel{right:8px;bottom:calc(var(--tb-h) + 7px)}
#startMenu{left:8px;bottom:calc(var(--tb-h) + 7px)}
#dayLabel{font-size:22px}
}
</style>
</head>
<body>

<div id="wallpaper"></div>
<div id="wallpaperBlur"></div>
<canvas id="snowFx" aria-hidden="true"></canvas>
<div id="dayLabel"></div>

<div class="desktop">
    <div class="taskbar">
        <div class="tb-resize" id="tbResize" title="Drag to resize"></div>
        <button class="tb-btn" id="startBtn" title="Start">
            <svg viewBox="0 0 20 20" fill="#fff"><rect x="1" y="1" width="8" height="8" rx="1.5"/><rect x="11" y="1" width="8" height="8" rx="1.5"/><rect x="1" y="11" width="8" height="8" rx="1.5"/><rect x="11" y="11" width="8" height="8" rx="1.5"/></svg>
        </button>
        <div class="tb-center" id="taskbarApps"></div>
        <div class="clock" id="taskbarClock" title="Date and time">
            <div id="clockTime"></div><div id="clockDate"></div>
        </div>
    </div>
</div>

<div id="startMenu">
    <div class="start-title">Apps</div>
    <div class="start-grid" id="startGrid"></div>
</div>

<div id="calendarPanel">
    <div class="calendar-header">
        <div><div class="calendar-time" id="panelTime"></div><div class="calendar-full-date" id="panelDate"></div></div>
        <button class="calendar-close" id="calendarClose">×</button>
    </div>
    <div class="weather-section">
        <div class="weather-top">
            <div>
                <div class="weather-temperature" id="weatherTemperature">--°</div>
                <div class="weather-description" id="weatherDescription">Weather unavailable</div>
                <div class="weather-location" id="weatherLocation">Enter a city below</div>
            </div>
            <div class="weather-icon" id="weatherIcon">☁</div>
        </div>
        <div class="weather-details">
            <div><span>Feels like</span><strong id="weatherFeels">--°</strong></div>
            <div><span>Wind</span><strong id="weatherWind">--</strong></div>
            <div><span>Humidity</span><strong id="weatherHumidity">--%</strong></div>
        </div>
        <div class="weather-location-controls">
            <input id="weatherCityInput" placeholder="Enter a city..." type="text">
            <button id="weatherGo">Go</button>
            <button id="weatherLocate" title="Use my location">⌖</button>
        </div>
        <div class="weather-credit">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>
    </div>
    <div class="calendar-divider"></div>
    <div class="calendar-navigation">
        <div class="calendar-month" id="calendarMonth"></div>
        <div class="calendar-arrows"><button data-month="-1">‹</button><button data-month="1">›</button></div>
    </div>
    <div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="calendar-days" id="calendarDays"></div>
    <div class="calendar-divider"></div>
    <div class="calendar-event-heading">What's happening</div>
    <div id="calendarEventList"></div>
</div>

<!-- ANNOUNCEMENT -->
<div id="announcement">
    <div class="announce-card">
        <h2>Announcement</h2>
        <p>a few errors with ngames and stuff, i'll fix later too lazy rn</p>
        <button id="ackBtn">
            <span class="label">Understood</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
    </div>
</div>

<script src="steam.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const put = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const raw = (k, d) => localStorage.getItem(k) || d;
const GH = "https://raw.githubusercontent.com/Timmers437283/game-site/main/Resources/AppBase/";
const BEACON = "https://raw.githubusercontent.com/Timmers437283/beacon/main/Resources/AppBase/";

/* APPS */
const availableApps = [
    {id:"movium",   name:"Movium",    icon:"Resources/AppBase/Movium/Movium.png", preview:"Resources/AppBase/Movium/Preview.png", src:"Resources/AppBase/Movium/index.html"},
    {id:"musify",   name:"Musify",    icon:GH+"Musify/Musify.png",    preview:GH+"Musify/Preview.png",    src:"https://timmers437283.github.io/Musify/"},
    {id:"celio",    name:"Celio",     icon:GH+"Celio/Celio.png",      preview:GH+"Celio/Preview.png",     src:"https://timmers437283.github.io/Celio/"},
    {id:"soundtrap",name:"Soundtrap", icon:GH+"Soundtrap/cover.png",  preview:GH+"Soundtrap/Preview.png", src:"https://www.soundtrap.com/home/"},
    {id:"chatgpt",  name:"ChatGPT",   icon:GH+"ChatGPT/chatgpt.png",  preview:GH+"ChatGPT/Preview.png",   src:"Resources/AppBase/ChatGPT/index.html"},
    {id:"steam",    name:"Steam",     icon:"Resources/AppBase/Steam/Steam.png",   preview:"Resources/AppBase/Steam/Preview.png"},
    {id:"ngames",   name:"NGames",    icon:BEACON+"NGames/small.png", preview:BEACON+"NGames/Preview.png", src:"https://timmers437283.github.io/beacon/Resources/AppBase/NGames/index.html"}
];
availableApps.forEach(a => a.windowId = a.id + "Window");

/* STATE */
const defaultWallpaper = "Windows_11.jpg";
let wallpaperFiles = [];
let installedWallpapers = store("installedWallpapers", []);
let installedApps = store("installedApps", []);
if (!Array.isArray(installedApps)) installedApps = [];
if (!installedWallpapers.includes(defaultWallpaper)) { installedWallpapers.push(defaultWallpaper); put("installedWallpapers", installedWallpapers); }
let currentWallpaper = raw("desktopWallpaper", defaultWallpaper);
let currentColor = raw("desktopColor", "#202020");
let currentBlur = raw("desktopBlur", "0");
let highestWindow = 10, windowOpenCount = 0;

/* WINDOWS (generated) */
const controls = '<div class="window-controls"><button data-act="min">−</button><button data-act="max">□</button><button class="close" data-act="close">×</button></div>';
const addWindow = (id, title, body, contentClass = "window-content") =>
    document.body.insertAdjacentHTML("beforeend",
        `<div class="window" id="${id}"><div class="titlebar"><span class="window-title">${title}</span>${controls}</div><div class="${contentClass}">${body}</div></div>`);

addWindow("settingsWindow", "Settings", `
    <div class="section-title">Settings</div>
    <div class="section-description">Personalize your desktop.</div>
    <div class="setting-section"><h3>Appearance</h3>
        <div class="setting-row"><span>Background color</span><input type="color" id="backgroundColor" value="#202020"></div>
        <div class="setting-row"><span>Background blur</span><input type="range" id="blurSlider" min="0" max="30" value="0"></div>
    </div>
    <div class="setting-section"><h3>Installed wallpapers</h3><div class="wallpaper-grid" id="installedGrid"></div></div>`,
    "window-content settings-content");

addWindow("storeWindow", "App Store", `
    <div class="store-sidebar">
        <button class="sidebar-button selected" id="appsTab">Apps</button>
        <button class="sidebar-button" id="wallpapersTab">Wallpapers</button>
    </div>
    <div class="store-main">
        <div id="appsPage"><div class="store-page-title">Apps</div><div class="store-page-description">Browse and install apps for your desktop.</div><div class="wallpaper-grid" id="appsGrid"></div></div>
        <div id="wallpapersPage" style="display:none"><div class="store-page-title">Wallpapers</div><div class="store-page-description">Browse and install wallpapers for your desktop.</div><div class="wallpaper-grid" id="storeGrid"></div></div>
    </div>`);

availableApps.filter(a => a.src).forEach(a =>
    addWindow(a.windowId, a.name, `<iframe src="${a.src}" title="${a.name}"></iframe>`, "window-content\" style=\"display:block;background:#111"));

const winEl = id => $(id);
const TB = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tb-h')) || 56;
const openWindow = id => {
    const win = winEl(id);
    if (!win) return;
    const wasOpen = win.classList.contains("active");
    /* reload any app that was stopped by the close button */
    win.querySelectorAll("iframe[data-src]").forEach(f => {
        if (f.getAttribute("src") === "about:blank") f.src = f.dataset.src;
    });
    win.classList.add("active");
    if (!wasOpen && !win.classList.contains("maximized")) {
        const off = (windowOpenCount++ % 7) * 28;
        const r = win.getBoundingClientRect();
        const w = r.width || Math.min(760, innerWidth - 30), h = r.height || Math.min(520, innerHeight - 75);
        win.style.transform = "none";
        win.style.left = Math.max(10, Math.min((innerWidth - w) / 2 + off, innerWidth - w - 10)) + "px";
        win.style.top = Math.max(10, Math.min((innerHeight - h) / 2 + off, innerHeight - h - TB() - 10)) + "px";
    }
    win.style.zIndex = ++highestWindow;
};

/* close / maximize (capture phase so nothing can swallow it) */
document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    e.stopPropagation();
    const win = b.closest(".window");
    if (!win) return;
    const act = b.dataset.act;
    if (act === "max") { win.classList.toggle("maximized"); win.style.zIndex = ++highestWindow; }
    else {
        win.classList.remove("active");           // min + close both hide
        if (act === "close") {
            win.classList.remove("maximized");    // reopen at normal size
            win.querySelectorAll("iframe").forEach(f => {   // actually stop the app
                if (!f.dataset.src) f.dataset.src = f.getAttribute("src");
                f.src = "about:blank";
            });
        }
    }
    updateRunning();
}, true);

/* resize + drag (also picks up windows added later, e.g. by steam.js) */
function initWindow(win) {
    if (win.dataset.ready) return;
    win.dataset.ready = "1";
    ["top","bottom","left","right","top-left","top-right","bottom-left","bottom-right"].forEach(edge => {
        const h = document.createElement("div");
        h.className = "window-edge " + edge;
        win.appendChild(h);
        let on = false, sx, sy, r;
        h.addEventListener("pointerdown", e => {
            if (win.classList.contains("maximized") || !win.classList.contains("active") || e.button !== 0) return;
            e.preventDefault(); e.stopPropagation();
            on = true; sx = e.clientX; sy = e.clientY; r = win.getBoundingClientRect();
            win.style.transform = "none";
            win.style.left = r.left + "px"; win.style.top = r.top + "px";
            win.style.zIndex = ++highestWindow;
            h.setPointerCapture(e.pointerId);
        });
        h.addEventListener("pointermove", e => {
            if (!on) return;
            const dx = e.clientX - sx, dy = e.clientY - sy, minW = 360, minH = 240;
            let l = r.left, t = r.top, rt = r.right, b = r.bottom;
            if (edge.includes("left")) l += dx;
            if (edge.includes("right")) rt += dx;
            if (edge.includes("top")) t += dy;
            if (edge.includes("bottom")) b += dy;
            l = Math.max(0, Math.min(l, innerWidth - minW));
            t = Math.max(0, Math.min(t, innerHeight - TB() - minH));
            rt = Math.max(l + minW, Math.min(rt, innerWidth));
            b = Math.max(t + minH, Math.min(b, innerHeight - TB()));
            Object.assign(win.style, {left: l + "px", top: t + "px", width: rt - l + "px", height: b - t + "px"});
        });
        ["pointerup","pointercancel","lostpointercapture"].forEach(ev => h.addEventListener(ev, () => on = false));
    });

    const bar = win.querySelector(".titlebar");
    if (!bar) return;
    let drag = false, ox, oy;
    bar.addEventListener("pointerdown", e => {
        if (e.target.closest(".window-controls") || win.classList.contains("maximized") || e.button !== 0) return;
        drag = true; win.style.zIndex = ++highestWindow;
        const r = win.getBoundingClientRect();
        ox = e.clientX - r.left; oy = e.clientY - r.top;
        win.style.transform = "none"; win.style.left = r.left + "px"; win.style.top = r.top + "px";
        bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove", e => {
        if (!drag) return;
        win.style.left = Math.max(0, Math.min(e.clientX - ox, innerWidth - win.offsetWidth)) + "px";
        win.style.top = Math.max(0, Math.min(e.clientY - oy, innerHeight - 90)) + "px";
    });
    ["pointerup","pointercancel"].forEach(ev => bar.addEventListener(ev, () => drag = false));
}
const initAllWindows = () => document.querySelectorAll(".window").forEach(initWindow);
initAllWindows();
new MutationObserver(initAllWindows).observe(document.body, {childList: true});

/* CLOCK */
const updateClock = () => {
    const now = new Date(), time = now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    $("clockTime").textContent = $("panelTime").textContent = time;
    $("clockDate").textContent = now.toLocaleDateString([], {month:"numeric", day:"numeric", year:"numeric"});
    $("panelDate").textContent = now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric", year:"numeric"});
    $("dayLabel").textContent = now.toLocaleDateString("en-US", {weekday:"long"}).toUpperCase();
};
updateClock();
setInterval(updateClock, 1000);

/* CALENDAR */
let calendarDate = new Date(), selectedDate = new Date();
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const nth = (y, m, wd, n) => new Date(y, m, 1 + (wd - new Date(y, m, 1).getDay() + 7) % 7 + (n - 1) * 7);

function holidays(y) {
    const memorial = new Date(y, 4, 31 - (new Date(y, 4, 31).getDay() + 6) % 7);
    return Object.fromEntries([
        [new Date(y, 0, 1), "New Year's Day"], [nth(y, 0, 1, 3), "Martin Luther King Jr. Day"],
        [nth(y, 1, 1, 3), "Presidents' Day"], [memorial, "Memorial Day"],
        [new Date(y, 5, 19), "Juneteenth"], [new Date(y, 6, 4), "Independence Day"],
        [nth(y, 8, 1, 1), "Labor Day"], [nth(y, 9, 1, 2), "Columbus Day"],
        [new Date(y, 10, 11), "Veterans Day"], [nth(y, 10, 4, 4), "Thanksgiving Day"],
        [new Date(y, 11, 25), "Christmas Day"]
    ].map(([d, n]) => [dateKey(d), n]));
}

function renderCalendar() {
    const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
    $("calendarMonth").textContent = calendarDate.toLocaleDateString([], {month:"long", year:"numeric"});
    const grid = $("calendarDays"), start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const today = dateKey(new Date()), sel = dateKey(selectedDate);
    grid.innerHTML = "";
    for (let i = 0; i < 42; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const k = dateKey(d), hol = holidays(d.getFullYear())[k];
        const day = document.createElement("div");
        day.className = "calendar-day" + (d.getMonth() !== m ? " other-month" : "") + (k === today ? " today" : "") + (k === sel ? " selected" : "");
        day.textContent = d.getDate();
        if (hol) { day.insertAdjacentHTML("beforeend", '<span class="holiday-dot"></span>'); day.title = hol; }
        day.onclick = () => {
            selectedDate = new Date(d);
            if (d.getMonth() !== m) calendarDate = new Date(d.getFullYear(), d.getMonth(), 1);
            renderCalendar();
        };
        grid.appendChild(day);
    }
    const name = holidays(selectedDate.getFullYear())[dateKey(selectedDate)];
    $("calendarEventList").innerHTML = name
        ? `<div class="calendar-event"><div class="event-marker"></div><div><div class="event-name">${name}</div><div class="event-description">Federal holiday</div></div></div>`
        : '<div class="no-events">No holidays or events for this day.</div>';
}

const panel = $("calendarPanel"), clock = $("taskbarClock");
function toggleCalendar() {
    closeStart();
    const open = panel.classList.toggle("open");
    clock.classList.toggle("selected", open);
    if (open) { calendarDate = new Date(); selectedDate = new Date(); updateClock(); renderCalendar(); }
}
clock.onclick = $("calendarClose").onclick = toggleCalendar;
document.querySelectorAll("[data-month]").forEach(b => b.onclick = () => {
    calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + +b.dataset.month, 1);
    selectedDate = new Date(calendarDate);
    renderCalendar();
});
document.addEventListener("click", e => {
    if (panel.classList.contains("open") && !panel.contains(e.target) && !clock.contains(e.target)) {
        panel.classList.remove("open"); clock.classList.remove("selected");
    }
});
renderCalendar();

/* WEATHER */
const WX = [
    [[0], "Clear sky", "☀"], [[1], "Mostly clear", "🌤"], [[2], "Partly cloudy", "⛅"], [[3], "Overcast", "☁"],
    [[45,48], "Foggy", "🌫"], [[51,53,55,56,57], "Drizzle", "🌦"], [[61,63,65,66,67], "Rain", "🌧"],
    [[71,73,75,77], "Snow", "❄"], [[80,81,82], "Rain showers", "🌧"], [[85,86], "Snow showers", "🌨"], [[95,96,99], "Thunderstorm", "⛈"]
];
const setWeatherText = t => $("weatherDescription").textContent = t;

async function loadWeather(lat, lon, name) {
    setWeatherText("Loading weather...");
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`);
        if (!res.ok) throw 0;
        const c = (await res.json()).current;
        const [, desc, icon] = WX.find(w => w[0].includes(c.weather_code)) || [0, "Unknown conditions", "☁"];
        $("weatherTemperature").textContent = Math.round(c.temperature_2m) + "°";
        $("weatherFeels").textContent = Math.round(c.apparent_temperature) + "°";
        $("weatherWind").textContent = Math.round(c.wind_speed_10m) + " mph";
        $("weatherHumidity").textContent = c.relative_humidity_2m + "%";
        $("weatherIcon").textContent = icon;
        $("weatherLocation").textContent = name;
        setWeatherText(desc);
        put("desktopWeatherLocation", {latitude: lat, longitude: lon, name});
    } catch { setWeatherText("Could not load weather"); }
}

async function searchWeather() {
    const city = $("weatherCityInput").value.trim();
    if (!city) return;
    setWeatherText("Searching...");
    try {
        const data = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`)).json();
        const p = data.results?.[0];
        if (!p) return setWeatherText("Location not found");
        await loadWeather(p.latitude, p.longitude, [p.name, p.admin1, p.country].filter(Boolean).join(", "));
    } catch { setWeatherText("Search failed"); }
}

$("weatherGo").onclick = searchWeather;
$("weatherCityInput").addEventListener("keydown", e => e.key === "Enter" && searchWeather());
$("weatherLocate").onclick = () => {
    if (!navigator.geolocation) return setWeatherText("Location is not supported");
    setWeatherText("Getting your location...");
    navigator.geolocation.getCurrentPosition(
        p => loadWeather(p.coords.latitude, p.coords.longitude, "Your location"),
        () => setWeatherText("Location permission denied"));
};
const savedWeather = store("desktopWeatherLocation", null);
if (savedWeather?.latitude != null) loadWeather(savedWeather.latitude, savedWeather.longitude, savedWeather.name || "Saved location");

/* WALLPAPER */
const wallpaperEl = $("wallpaper");
const isVideo = f => /\.(mp4|webm|ogg)$/i.test(f);
const wallpaperPath = f => "Wallpaper/" + encodeURIComponent(f);
const displayName = f => f.replace(/\.[^/.]+$/, "").replace(/_/g, " ");

function applyColor() {
    wallpaperEl.innerHTML = "";
    wallpaperEl.style.backgroundImage = "none";
    wallpaperEl.style.backgroundColor = currentColor;
    $("backgroundColor").value = currentColor;
}

function applyWallpaper(f) {
    currentWallpaper = f;
    localStorage.setItem("desktopWallpaper", f);
    if (f === "__solid__") return applyColor();
    wallpaperEl.innerHTML = "";
    wallpaperEl.style.backgroundColor = "#111";
    if (isVideo(f)) {
        const v = Object.assign(document.createElement("video"), {src: wallpaperPath(f), autoplay: true, muted: true, loop: true, playsInline: true, preload: "auto"});
        wallpaperEl.appendChild(v);
        v.play().catch(() => {});
    } else wallpaperEl.style.backgroundImage = `url("${wallpaperPath(f)}")`;
}

const applyBlur = () => {
    $("wallpaperBlur").style.backdropFilter = `blur(${currentBlur}px)`;
    $("blurSlider").value = currentBlur;
};

$("backgroundColor").oninput = e => {
    currentColor = e.target.value;
    localStorage.setItem("desktopColor", currentColor);
    applyWallpaper("__solid__");
};
$("blurSlider").oninput = e => { currentBlur = e.target.value; localStorage.setItem("desktopBlur", currentBlur); applyBlur(); };

function createPreview(f) {
    const p = document.createElement("div");
    p.className = "preview";
    if (!isVideo(f)) {
        p.innerHTML = `<img src="${wallpaperPath(f)}" alt="${f}">`;
        return p;
    }
    const v = Object.assign(document.createElement("video"), {muted: true, loop: true, playsInline: true, preload: "auto", src: wallpaperPath(f)});
    v.load();
    v.addEventListener("loadeddata", () => { v.pause(); v.currentTime = 0; }, {once: true});
    let t;
    p.onmouseenter = () => t = setTimeout(() => v.play().catch(() => {}), 500);
    p.onmouseleave = () => { clearTimeout(t); v.pause(); try { v.currentTime = 0; } catch {} };
    p.appendChild(v);
    return p;
}

/* CARDS (shared by wallpapers + apps) */
function makeCard({preview, name, icon, installed, onInstall, label}) {
    const card = document.createElement("div");
    card.className = "wallpaper-card";
    const info = document.createElement("div");
    info.className = "wallpaper-info";
    info.innerHTML = icon
        ? `<div class="app-heading"><img class="app-icon" src="${icon}" alt=""><div class="wallpaper-name">${name}</div></div>`
        : `<div class="wallpaper-name">${name}</div>`;
    const btn = document.createElement("button");
    btn.textContent = label || (installed ? "Installed" : "Install");
    btn.disabled = installed;
    info.appendChild(btn);
    if (onInstall) {
        const prog = document.createElement("div"), fill = document.createElement("div");
        prog.className = "progress"; fill.className = "progress-fill";
        prog.appendChild(fill); info.appendChild(prog);
        btn.onclick = () => {
            btn.disabled = true; btn.textContent = "Installing..."; prog.style.display = "block";
            const dur = 200 + Math.random() * 400, t0 = performance.now();
            const step = now => {
                const a = Math.min((now - t0) / dur, 1);
                fill.style.width = a * 100 + "%";
                a < 1 ? requestAnimationFrame(step) : onInstall();
            };
            requestAnimationFrame(step);
        };
    }
    card.append(preview, info);
    return {card, btn};
}

function renderInstalled() {
    const grid = $("installedGrid");
    grid.innerHTML = "";
    installedWallpapers.forEach(f => {
        const current = currentWallpaper === f;
        const {card, btn} = makeCard({preview: createPreview(f), name: displayName(f), installed: current, label: current ? "Currently selected" : "Use wallpaper"});
        if (!current) btn.onclick = () => { applyWallpaper(f); renderInstalled(); };
        grid.appendChild(card);
    });
}

function renderStore() {
    const grid = $("storeGrid");
    grid.innerHTML = "";
    wallpaperFiles.filter(f => f !== defaultWallpaper).forEach(f =>
        grid.appendChild(makeCard({
            preview: createPreview(f), name: displayName(f), installed: installedWallpapers.includes(f),
            onInstall: () => { installedWallpapers.push(f); put("installedWallpapers", installedWallpapers); renderStore(); renderInstalled(); }
        }).card));
}

function renderApps() {
    const grid = $("appsGrid");
    grid.innerHTML = "";
    availableApps.forEach(app => {
        const preview = document.createElement("div");
        preview.className = "preview app";
        preview.innerHTML = `<img src="${app.preview}" alt="${app.name} preview" loading="lazy">`;
        grid.appendChild(makeCard({
            preview, name: app.name, icon: app.icon, installed: installedApps.includes(app.id),
            onInstall: () => { installedApps.push(app.id); put("installedApps", installedApps); renderApps(); renderDesktopApps(); }
        }).card);
    });
}

async function loadWallpapers() {
    try {
        const res = await fetch("wallpapers.json?v=" + Date.now(), {cache: "no-store"});
        if (!res.ok) throw 0;
        const files = await res.json();
        if (!Array.isArray(files)) throw 0;
        wallpaperFiles = [...new Set(files)].filter(f => typeof f === "string" && /\.(jpg|jpeg|png|webp|mp4|webm|ogg)$/i.test(f));
        renderStore();
        renderInstalled();
    } catch {
        $("storeGrid").innerHTML = '<div class="empty-state">Could not load wallpapers.json.</div>';
    }
}

function showStoreTab(tab) {
    const apps = tab === "apps";
    $("appsPage").style.display = apps ? "block" : "none";
    $("wallpapersPage").style.display = apps ? "none" : "block";
    $("appsTab").classList.toggle("selected", apps);
    $("wallpapersTab").classList.toggle("selected", !apps);
    apps ? renderApps() : renderStore();
}
$("appsTab").onclick = () => showStoreTab("apps");
$("wallpapersTab").onclick = () => showStoreTab("wallpapers");

/* TASKBAR + START MENU */
const pinned = [
    {id:"app-store", name:"App Store", icon:"Resources/Icons/AppStore.png", win:"storeWindow"},
    {id:"settings", name:"Settings", icon:"https://raw.githubusercontent.com/Timmers437283/beacon/main/Resources/Icons/settingscover.png", win:"settingsWindow"},
    ...["steam","ngames"].map(id => { const a = availableApps.find(x => x.id === id); return {id, name:a.name, icon:a.icon, win:a.windowId}; })
];
const startMenu = $("startMenu"), startBtn = $("startBtn");
function closeStart() { startMenu.classList.remove("open"); startBtn.classList.remove("selected"); }
function launch(w) { closeStart(); openWindow(w); updateRunning(); }
function updateRunning() {
    document.querySelectorAll("#taskbarApps .tb-btn").forEach((b, i) =>
        b.classList.toggle("running", !!winEl(pinned[i].win)?.classList.contains("active")));
}
function renderTaskbar() {
    const box = $("taskbarApps");
    box.innerHTML = "";
    pinned.forEach(p => {
        const b = document.createElement("button");
        b.className = "tb-btn"; b.title = p.name;
        b.innerHTML = `<img src="${p.icon}" alt="${p.name}">`;
        b.onclick = () => {
            const w = winEl(p.win);
            if (w && w.classList.contains('active')) { w.classList.remove('active'); updateRunning(); return; }
            b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); launch(p.win);
        };
        box.appendChild(b);
    });
    updateRunning();
}
function renderDesktopApps() {
    const grid = $("startGrid");
    grid.innerHTML = "";
    const ids = new Set(pinned.map(p => p.id));
    const list = [...pinned, ...availableApps.filter(a => installedApps.includes(a.id) && !ids.has(a.id))
        .map(a => ({id:a.id, name:a.name, icon:a.icon, win:a.windowId}))];
    list.sort((a, b) => a.name.localeCompare(b.name));
    list.forEach(p => {
        const d = document.createElement("div");
        d.className = "start-item";
        d.innerHTML = `<img src="${p.icon}" alt=""><span>${p.name}</span>`;
        d.onclick = () => launch(p.win);
        grid.appendChild(d);
    });
}
startBtn.onclick = e => {
    e.stopPropagation();
    panel.classList.remove("open"); clock.classList.remove("selected");
    const o = startMenu.classList.toggle("open");
    startBtn.classList.toggle("selected", o);
    if (o) renderDesktopApps();
};
document.addEventListener("click", e => {
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) closeStart();
});

/* RESIZABLE TASKBAR (min 56px) */
const setTB = h => { h = Math.max(56, Math.min(110, h)); document.documentElement.style.setProperty('--tb-h', h + 'px'); return h; };
setTB(+raw("taskbarHeight", 56));
(() => {
    const h = $("tbResize"); let on = false;
    h.addEventListener("pointerdown", e => { on = true; h.setPointerCapture(e.pointerId); e.preventDefault(); });
    h.addEventListener("pointermove", e => { if (on) setTB(innerHeight - e.clientY); });
    ["pointerup","pointercancel"].forEach(ev => h.addEventListener(ev, () => { if (!on) return; on = false; localStorage.setItem("taskbarHeight", TB()); }));
})();

/* SNOW (above wallpaper, behind everything else) */
(() => {
    const cv = $("snowFx"), cx = cv.getContext("2d");
    let W, H;
    const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
    size();
    addEventListener("resize", size);
    const FLAKES = 30; // raise for heavier snow
    const flakes = Array.from({length: FLAKES}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2, s: Math.random() + 0.5}));
    (function draw() {
        cx.clearRect(0, 0, W, H);
        cx.fillStyle = "rgba(255,255,255,0.3)";
        flakes.forEach(f => {
            cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, Math.PI * 2); cx.fill();
            f.y += f.s;
            if (f.y > H) f.y = 0;
        });
        requestAnimationFrame(draw);
    })();
})();

/* INIT */
renderTaskbar();
renderApps();
renderDesktopApps();
applyBlur();
if (currentWallpaper !== "__solid__" && !installedWallpapers.includes(currentWallpaper)) currentWallpaper = defaultWallpaper;
applyWallpaper(currentWallpaper);
loadWallpapers();

/* ANNOUNCEMENT */
const ackBtn = $("ackBtn"), announcement = $("announcement");
ackBtn.onclick = () => {
    ackBtn.classList.add("done");
    setTimeout(() => {
        announcement.classList.add("hide");
        setTimeout(() => announcement.remove(), 500);
    }, 1300);
};
</script>
