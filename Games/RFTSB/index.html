<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity WebGL Player | Reach For The Sky</title>

  <link rel="shortcut icon"
    href="https://fastly.jsdelivr.net/gh/linkawaken1979-alt/Reach-For-The-Sky-on-the-Web@main/TemplateData/favicon.ico">

  <link rel="stylesheet"
    href="https://fastly.jsdelivr.net/gh/linkawaken1979-alt/Reach-For-The-Sky-on-the-Web@main/TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231F20;
    }

    #unity-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #unity-footer {
      display: none !important;
    }

    #unity-loading-bar {
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Reach For The Sky</div>
    </div>
  </div>

  <script>
    const CDN =
      "https://fastly.jsdelivr.net/gh/linkawaken1979-alt/Reach-For-The-Sky-on-the-Web@main";

    const RAW =
      "https://raw.githubusercontent.com/linkawaken1979-alt/Reach-For-The-Sky-on-the-Web/main";

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      const div = document.createElement("div");
      div.textContent = msg;

      if (type === "error") {
        div.style.cssText = "background:red;color:white;padding:10px;";
      } else if (type === "warning") {
        div.style.cssText = "background:yellow;padding:10px;";
        setTimeout(() => div.remove(), 5000);
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";
    }

    const config = {
      // Raw GitHub: large files
      dataUrl: RAW + "/Build/WebGL.data",
      codeUrl: RAW + "/Build/WebGL.wasm",

      // jsDelivr: framework
      frameworkUrl: CDN + "/Build/WebGL.framework.js",

      streamingAssetsUrl: CDN + "/StreamingAssets",

      companyName: "Barji",
      productName: "Reach For The Sky",
      productVersion: "1.0.0",

      showBanner: unityShowBanner,
      devicePixelRatio: 1
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    function resizeCanvas() {
      const ratio = config.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    loadingBar.style.display = "block";

    const script = document.createElement("script");

    // jsDelivr: Unity loader
    script.src = CDN + "/Build/WebGL.loader.js";

    script.onload = function () {
      if (typeof createUnityInstance !== "function") {
        unityShowBanner("Unity loader did not initialize correctly.", "error");
        return;
      }

      createUnityInstance(canvas, config, progress => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then(unityInstance => {
        loadingBar.style.display = "none";

        canvas.addEventListener("dblclick", () => {
          unityInstance.SetFullscreen(1);
        });
      }).catch(error => {
        console.error("Unity initialization failed:", error);
        unityShowBanner(String(error), "error");
      });
    };

    script.onerror = function () {
      unityShowBanner("Failed to load Unity WebGL loader.", "error");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
