<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGames</title>
<style>
:root {
    --bg: #ebebeb; --ink: #2d2d2d; --muted: #8a8a8a; --accent: #00c3e3; --title: #0ab9e6; --red: #e60012;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; user-select: none; }
.home { position: relative; height: 100%; display: flex; flex-direction: column; padding: 0 5%; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 0; }
.users { display: flex; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #d6d6d6; border: 2px solid #fff; box-shadow: 0 1px 3px #0003; }
.avatar.a { background: radial-gradient(circle at 50% 38%, #fff 0 22%, transparent 23%), var(--red); }
.avatar.b { background: radial-gradient(circle at 50% 38%, #fff 0 22%, transparent 23%), #3a8dde; }
.status { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; }
.battery { width: 22px; height: 11px; border: 2px solid var(--ink); border-radius: 3px; position: relative; }
.battery::after { content: ""; position: absolute; inset: 1px; right: 4px; background: var(--ink); border-radius: 1px; }

/* title of selected game */
.title { display: flex; align-items: center; gap: 8px; margin: 46px 0 10px; font-size: 17px; font-weight: 600; color: var(--title); min-height: 24px; }
.title i { width: 11px; height: 17px; background: var(--title); border-radius: 2px; flex: none; }
.title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* game row */
.row { display: flex; align-items: center; gap: 14px; padding: 22px 6px; margin: 0 -6px; overflow-x: auto;
    scroll-behavior: smooth; scrollbar-width: none; scroll-snap-type: x proximity; }
.row::-webkit-scrollbar { display: none; }
.tile { flex: none; width: 112px; height: 112px; border-radius: 3px; overflow: hidden; position: relative; cursor: pointer;
    background: var(--c, #999); box-shadow: 0 2px 5px #0003; scroll-snap-align: center;
    transition: width .18s ease, height .18s ease, box-shadow .18s ease; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.tile .fallback { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 10px; color: #fff;
    font-weight: 700; font-size: 15px; line-height: 1.15; background: linear-gradient(160deg, #fff3 0, transparent 55%), var(--c, #999); }
.tile.sel { width: 168px; height: 168px; box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent), 0 8px 18px #0004;
    animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { outline: 0 solid #00c3e300; } to { outline: 3px solid #00c3e366; outline-offset: 7px; } }
.empty { color: var(--muted); font-size: 14px; padding: 40px 0; line-height: 1.5; }

/* round buttons */
.dock { display: flex; justify-content: center; gap: 18px; margin-top: auto; margin-bottom: 14%; padding-top: 10px; }
.dock button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; color: #555; font-size: 19px; cursor: pointer;
    box-shadow: 0 1px 4px #0003; display: grid; place-items: center; transition: transform .12s ease; }
.dock button:hover, .dock button:focus-visible { transform: scale(1.12); outline: 3px solid var(--accent); outline-offset: 2px; }
.dock .online { background: var(--red); color: #fff; font-size: 8px; font-weight: 700; }

/* hints */
.hints { position: absolute; left: 5%; right: 5%; bottom: 0; height: 40px; border-top: 1px solid #cfcfcf; display: flex;
    align-items: center; justify-content: space-between; font-size: 12px; color: #555; }
.hints div { display: flex; gap: 18px; }
.hints b { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: #555; color: #fff; font-size: 10px; margin-right: 5px; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 60px; transform: translate(-50%, 20px); background: #2d2d2de6; color: #fff;
    padding: 9px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* running game */
.player { position: absolute; inset: 0; background: #000; display: none; z-index: 5; }
.player.on { display: block; }
.player iframe { width: 100%; height: 100%; border: 0; background: #000; }
.player .home-btn { position: absolute; top: 10px; left: 10px; z-index: 2; padding: 7px 14px; border: 0; border-radius: 18px;
    background: #000a; color: #fff; font-size: 13px; cursor: pointer; opacity: .55; transition: opacity .15s; }
.player .home-btn:hover, .player .home-btn:focus-visible { opacity: 1; }

@media (max-width: 620px) {
    .tile { width: 88px; height: 88px; } .tile.sel { width: 130px; height: 130px; }
    .dock { gap: 10px; } .dock button { width: 38px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { .tile, .tile.sel { transition: none; animation: none; } .row { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="home" id="home">
    <div class="top">
        <div class="users"><div class="avatar a"></div><div class="avatar b"></div></div>
        <div class="status"><span id="clock"></span><span class="battery" title="Battery"></span></div>
    </div>

    <div class="title"><i></i><span id="gameTitle"></span></div>
    <div class="row" id="row" tabindex="0" aria-label="Games"></div>

    <div class="dock" id="dock">
        <button class="online" title="Online" data-soon>ONLINE</button>
        <button title="News" data-soon>&#9993;</button>
        <button title="Shop" data-soon>&#128717;</button>
        <button title="Add shortcut to desktop (P)" id="pinBtn">&#128204;</button>
        <button title="Controllers" data-soon>&#127918;</button>
        <button title="Settings" data-soon>&#9881;</button>
        <button title="Back to first game" id="firstBtn">&#9211;</button>
    </div>

    <div class="hints">
        <div><span>&#9664; &#9654; Scroll</span></div>
        <div><span><b>P</b>Shortcut</span><span><b>Enter</b>Start</span></div>
    </div>
    <div class="toast" id="toast"></div>

    <div class="player" id="player">
        <button class="home-btn" id="homeBtn">&#8962; Home</button>
        <iframe id="gameFrame" allow="fullscreen; autoplay; gamepad" title="Game"></iframe>
    </div>
</div>

<script>
(function () {
    "use strict";
    var SHORTCUT_KEY = "beacon_ngames_shortcuts";
    var MESSAGE = "beacon-ngames-shortcut";
    var games = [], index = 0;
    var row = document.getElementById("row");
    var titleEl = document.getElementById("gameTitle");
    var toastEl = document.getElementById("toast");
    var player = document.getElementById("player");
    var frame = document.getElementById("gameFrame");

    /* clock */
    function tick() {
        var d = new Date(), h = d.getHours() % 12 || 12, m = String(d.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = h + ":" + m + (d.getHours() < 12 ? " AM" : " PM");
    }
    tick(); setInterval(tick, 20000);

    function toast(text) {
        toastEl.textContent = text; toastEl.classList.add("show");
        clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
    }

    /* shortcuts */
    function loadShortcuts() {
        try { var l = JSON.parse(localStorage.getItem(SHORTCUT_KEY) || "[]"); return Array.isArray(l) ? l : []; }
        catch (e) { return []; }
    }
    function pin(game) {
        var list = loadShortcuts();
        if (list.some(function (s) { return s.id === game.id; })) { toast(game.title + " is already on your desktop"); return; }
        list.push({ id: game.id, title: game.title, icon: game.icon || game.cover || "" });
        try { localStorage.setItem(SHORTCUT_KEY, JSON.stringify(list)); } catch (e) { toast("Could not save the shortcut"); return; }
        try { window.parent.postMessage({ type: MESSAGE }, location.origin); } catch (e) {}
        toast("Shortcut added to desktop");
    }

    /* row */
    function render() {
        row.innerHTML = "";
        if (!games.length) {
            row.innerHTML = '<div class="empty">No games yet.<br>Add games to NGames.json and reload.</div>';
            titleEl.textContent = ""; return;
        }
        games.forEach(function (g, i) {
            var t = document.createElement("div");
            t.className = "tile"; t.style.setProperty("--c", g.color || "#999");
            t.title = g.title;
            var fb = document.createElement("div"); fb.className = "fallback"; fb.textContent = g.title; t.appendChild(fb);
            if (g.cover) {
                var img = document.createElement("img"); img.alt = g.title; img.src = g.cover;
                img.onload = function () { fb.remove(); };
                img.onerror = function () { img.remove(); };
                t.appendChild(img);
            }
            t.addEventListener("click", function () { if (i === index) play(g); else select(i); });
            row.appendChild(t);
        });
        select(index, true);
    }
    function select(i, instant) {
        if (!games.length) return;
        index = Math.max(0, Math.min(games.length - 1, i));
        Array.prototype.forEach.call(row.children, function (el, n) { el.classList.toggle("sel", n === index); });
        titleEl.textContent = games[index].title;
        var el = row.children[index];
        row.style.scrollBehavior = instant ? "auto" : "";
        row.scrollTo({ left: el.offsetLeft - (row.clientWidth - 168) / 2 });
    }

    /* playing */
    function play(g) {
        frame.src = g.url; player.classList.add("on");
        setTimeout(function () { try { frame.focus(); } catch (e) {} }, 50);
    }
    function home() { player.classList.remove("on"); frame.src = "about:blank"; row.focus(); }
    document.getElementById("homeBtn").onclick = home;

    /* input */
    document.addEventListener("keydown", function (e) {
        if (player.classList.contains("on")) { if (e.key === "Escape") home(); return; }
        if (e.key === "ArrowRight") { select(index + 1); e.preventDefault(); }
        else if (e.key === "ArrowLeft") { select(index - 1); e.preventDefault(); }
        else if (e.key === "Home") select(0);
        else if (e.key === "End") select(games.length - 1);
        else if (e.key === "Enter" && games[index] && document.activeElement.tagName !== "BUTTON") play(games[index]);
        else if ((e.key === "p" || e.key === "P") && games[index]) pin(games[index]);
    });
    row.addEventListener("wheel", function (e) {
        if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        if (row.__wait) return;
        row.__wait = true; setTimeout(function () { row.__wait = false; }, 120);
        select(index + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });
    var startX = null;
    row.addEventListener("pointerdown", function (e) { startX = e.clientX; });
    row.addEventListener("pointerup", function (e) {
        if (startX === null) return;
        var dx = e.clientX - startX; startX = null;
        if (Math.abs(dx) > 50) select(index + (dx < 0 ? 1 : -1));
    });
    document.getElementById("pinBtn").onclick = function () { if (games[index]) pin(games[index]); };
    document.getElementById("firstBtn").onclick = function () { select(0); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-soon]"), function (b) {
        b.onclick = function () { toast(b.title + " is not available yet"); };
    });

    /* load games */
    fetch("NGames.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
            games = (Array.isArray(data) ? data : data.games || []).filter(function (g) { return g && g.id && g.title && g.url; });
            render();
            var want = new URLSearchParams(location.search).get("play");
            if (want) {
                var i = games.findIndex(function (g) { return g.id === want; });
                if (i > -1) { select(i, true); play(games[i]); }
            }
        })
        .catch(function () {
            row.innerHTML = '<div class="empty">Could not load NGames.json.<br>Open Beacon through a web server (not by double-clicking the file).</div>';
        });
})();
</script>
</body>
</html>
