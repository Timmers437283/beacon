<script>
(function () {
	var BAD = new RegExp("(^|\\.)(" + ["r9x.in","doubleclick.net","googlesyndication.com","googletagservices.com","googletagmanager.com","google-analytics.com","adtrafficquality.google","fundingchoicesmessages.google.com","imasdk.googleapis.com","cloudflareinsights.com","clarity.ms","hotjar.com","railway.app","adinplay.com","pubmatic.com","rubiconproject.com","adnxs.com","amazon-adsystem.com","criteo.com","taboola.com","outbrain.com","moatads.com","scorecardresearch.com","sentry.io","mixpanel.com","amplitude.com"].join("|").replace(/\./g, "\\.") + ")$", "i");

	function bad(u) {
		try {
			return BAD.test(new URL(String(u), location.href).hostname);
		} catch (e) {
			return false;
		}
	}

	function blocked(el) {
		setTimeout(function () {
			try {
				el.dispatchEvent(new Event("error"));
			} catch (e) {}
		}, 0);
	}

	function patchSrc(proto) {
		var d = Object.getOwnPropertyDescriptor(proto, "src");
		if (!d || !d.set) return;
		Object.defineProperty(proto, "src", {
			configurable: true,
			enumerable: d.enumerable,
			get: d.get,
			set: function (v) {
				if (bad(v)) return blocked(this);
				d.set.call(this, v);
			},
		});
	}

	patchSrc(HTMLScriptElement.prototype);
	patchSrc(HTMLIFrameElement.prototype);
	patchSrc(HTMLImageElement.prototype);

	var setAttr = Element.prototype.setAttribute;
	Element.prototype.setAttribute = function (n, v) {
		if (/^src$/i.test(n) && /^(script|iframe|img)$/i.test(this.tagName) && bad(v)) return blocked(this);
		return setAttr.apply(this, arguments);
	};

	if (window.fetch) {
		var f = window.fetch;
		window.fetch = function (r) {
			if (bad(r && r.url ? r.url : r)) return Promise.reject(new TypeError("Failed to fetch"));
			return f.apply(this, arguments);
		};
	}

	var open = XMLHttpRequest.prototype.open;
	XMLHttpRequest.prototype.open = function (m, u) {
		if (bad(u)) arguments[1] = "about:blank";
		return open.apply(this, arguments);
	};

	if (window.WebSocket) {
		var WS = window.WebSocket;
		var Guarded = function (u, p) {
			if (bad(u)) throw new DOMException("The connection was refused.", "SecurityError");
			return arguments.length > 1 ? new WS(u, p) : new WS(u);
		};
		Guarded.prototype = WS.prototype;
		["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) {
			Guarded[k] = WS[k];
		});
		window.WebSocket = Guarded;
	}

	if (navigator.sendBeacon) {
		var sb = navigator.sendBeacon;
		navigator.sendBeacon = function (u) {
			return bad(u) ? false : sb.apply(this, arguments);
		};
	}
})();
</script>

<script>
async function loadAndRun() {
	const urls = [
		"https://fastly.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part1",
		"https://fastly.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part2",

		"https://fastly.jsdelivr.net/gh/MartinMMCyt/minecraft@main/26.2/eaglercraft-26.2-0.5.html.part4"
	];

	let fullHtml = "";

	for (const u of urls) {
		const res = await fetch(u);
		if (!res.ok) throw new Error("Failed to load: " + u);
		fullHtml += await res.text();
	}

	document.open();
	document.write(fullHtml);
	document.close();
}

loadAndRun();
</script>
