
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, sans-serif;
    background: #191919;
    color: white;
    overflow: hidden;
    user-select: none;
}

button {
    font-family: inherit;
    color: inherit;
}

.desktop {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: #191919;
    isolation: isolate;
}

/* WALLPAPER */

.wallpaper-layer {
    position: absolute;
    inset: -35px;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}

.wallpaper-layer video,
.wallpaper-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: blur(var(--wallpaper-blur, 0px));
    transform: scale(1.02);
}

/* DESKTOP ICONS */

.desktop-icons {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.desktop-icon {
    width: 82px;
    min-height: 82px;
    padding: 8px 5px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    text-align: center;
}

.desktop-icon:hover {
    background: rgba(255,255,255,.12);
    border-color: rgba(255,255,255,.12);
}

.desktop-icon img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}

.desktop-icon span {
    font-size: 11px;
    color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
}

/* TASKBAR */

.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 15px;
    background: rgba(18,18,18,.80);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-top: 1px solid rgba(255,255,255,.06);
    z-index: 100;
}

.taskbar-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.settings-button {
    width: 37px;
    height: 37px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: background .15s;
}

.settings-button:hover {
    background: rgba(255,255,255,.13);
}

.clock {
    text-align: right;
    font-size: 12px;
    line-height: 17px;
    min-width: 80px;
}

.clock .time {
    font-size: 13px;
    font-weight: 600;
}

/* WINDOWS */

.app-window {
    position: absolute;
    width: 720px;
    height: 550px;
    max-width: calc(100vw - 30px);
    max-height: calc(100dvh - 85px);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: none;
    flex-direction: column;
    background: rgba(27,27,27,.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 15px 60px rgba(0,0,0,.4);
    z-index: 50;
    transition:
        left .24s cubic-bezier(.2,.8,.2,1),
        top .24s cubic-bezier(.2,.8,.2,1),
        width .24s cubic-bezier(.2,.8,.2,1),
        height .24s cubic-bezier(.2,.8,.2,1),
        border-radius .24s ease;
}

.app-window.open {
    display: flex;
    animation: windowOpen .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes windowOpen {
    from {
        opacity: 0;
        transform: translate(-50%, -47%) scale(.97);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* TITLEBAR */

.titlebar {
    height: 43px;
    min-height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.035);
    border-bottom: 1px solid rgba(255,255,255,.07);
    cursor: grab;
    touch-action: none;
}

.titlebar:active {
    cursor: grabbing;
}

.window-title {
    font-size: 12px;
    color: #ddd;
    padding-left: 16px;
    font-weight: 500;
    pointer-events: none;
}

.window-controls {
    display: flex;
    height: 100%;
    align-items: stretch;
}

.window-control {
    width: 44px;
    border: none;
    background: transparent;
    color: #ddd;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background .12s;
}

.window-control:hover {
    background: rgba(255,255,255,.12);
}

.window-control.close:hover {
    background: #c42b1c;
    color: white;
}

.maximize-icon {
    width: 10px;
    height: 10px;
    border: 1px solid currentColor;
}

.restore-icon {
    width: 11px;
    height: 10px;
    position: relative;
    border: 1px solid currentColor;
}

.restore-icon::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 7px;
    border: 1px solid currentColor;
    background: #292929;
    top: -4px;
    left: 3px;
}

/* SETTINGS */

.window-body {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.sidebar {
    width: 190px;
    flex-shrink: 0;
    background: rgba(255,255,255,.025);
    padding: 25px 12px;
    border-right: 1px solid rgba(255,255,255,.07);
}

.sidebar h2 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 12px 25px;
}

.side-button {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #ccc;
    border: none;
    text-align: left;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
}

.side-button:hover,
.side-button.active {
    background: rgba(255,255,255,.1);
    color: white;
}

.content {
    flex: 1;
    min-width: 0;
    padding: 27px;
    overflow-y: auto;
}

.content::-webkit-scrollbar {
    width: 5px;
}

.content::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 10px;
}

.content h1 {
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 7px;
}

.subtitle {
    color: #999;
    font-size: 12px;
    margin-bottom: 25px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 11px;
}

/* COLOR */

.color-picker-container {
    display: flex;
    align-items: center;
    gap: 13px;
    background: rgba(255,255,255,.045);
    padding: 12px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.08);
}

.color-picker {
    width: 43px;
    height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
}

.color-value {
    color: #aaa;
    font-size: 12px;
}

/* BLUR */

.slider-container {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    padding: 15px;
    border-radius: 7px;
}

.slider-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.slider-label,
.slider-number {
    font-size: 12px;
    color: #ddd;
}

.slider-number {
    color: #aaa;
}

.blur-slider {
    width: 100%;
    height: 4px;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255,255,255,.2);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
}

.blur-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    border: 2px solid #aaa;
    cursor: pointer;
}

.blur-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    border: 2px solid #aaa;
    cursor: pointer;
}

/* WALLPAPERS */

.wallpaper-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 13px;
}

.wallpaper-card {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    background: #222;
    transition: border-color .15s, transform .15s;
}

.wallpaper-card:hover {
    border-color: rgba(255,255,255,.55);
    transform: translateY(-2px);
}

.wallpaper-card.selected {
    border: 2px solid #60a5fa;
}

.wallpaper-preview {
    width: 100%;
    height: 115px;
    object-fit: cover;
    display: block;
    background: #333;
}

.wallpaper-name {
    padding: 10px;
    font-size: 12px;
    color: #eee;
}

.empty-message {
    color: #999;
    font-size: 12px;
    padding: 15px 0;
}

/* APP STORE */

.store-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.store-heading h1 {
    margin-bottom: 7px;
}

.store-tabs {
    display: flex;
    gap: 8px;
    margin: 18px 0 22px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    padding-bottom: 12px;
}

.store-tab {
    border: none;
    background: transparent;
    color: #aaa;
    padding: 9px 13px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
}

.store-tab:hover,
.store-tab.active {
    background: rgba(255,255,255,.1);
    color: white;
}

.store-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 13px;
}

.store-card {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 7px;
    overflow: hidden;
}

.store-card-preview {
    width: 100%;
    height: 125px;
    object-fit: cover;
    display: block;
    background: #333;
}

.store-card-info {
    padding: 12px;
}

.store-card-name {
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 10px;
}

.store-card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.install-button {
    border: none;
    background: #eee;
    color: #171717;
    padding: 7px 13px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    min-width: 75px;
}

.install-button:hover:not(:disabled) {
    background: white;
}

.install-button:disabled {
    opacity: .65;
    cursor: default;
}

.installed-label {
    color: #8fc99a;
    font-size: 11px;
}

.store-empty {
    color: #999;
    font-size: 12px;
    padding: 15px 0;
}

/* MOBILE */

@media(max-width: 550px) {
    .sidebar {
        width: 120px;
        padding: 20px 7px;
    }

    .sidebar h2 {
        font-size: 16px;
        margin-left: 8px;
    }

    .content {
        padding: 18px 12px;
    }

    .wallpaper-grid,
    .store-grid {
        grid-template-columns: 1fr;
    }

    .app-window {
        max-width: 100vw;
        max-height: calc(100dvh - 52px);
    }
}
</style>
</head>

<body>

<div class="desktop" id="desktop">

    <div class="wallpaper-layer" id="wallpaperLayer"></div>

    <div class="desktop-icons">
        <button class="desktop-icon" onclick="openStore()">
            <img src="Resources/Icons/AppStore.png" alt="App Store"
                 onerror="this.style.display='none'">
            <span>AppStore</span>
        </button>
    </div>

    <!-- SETTINGS WINDOW -->

    <div class="app-window" id="settingsWindow">

        <div class="titlebar" id="settingsTitlebar">
            <div class="window-title">Settings</div>

            <div class="window-controls">
                <button class="window-control" onclick="minimizeWindow('settingsWindow')" title="Minimize">−</button>
                <button class="window-control" id="settingsMaxButton" onclick="maximizeWindow('settingsWindow')" title="Maximize">
                    <span class="maximize-icon" id="settingsMaxIcon"></span>
                </button>
                <button class="window-control close" onclick="closeWindow('settingsWindow')" title="Close">×</button>
            </div>
        </div>

        <div class="window-body">

            <div class="sidebar">
                <h2>Settings</h2>
                <button class="side-button active">Wallpapers</button>
            </div>

            <div class="content">
                <h1>Personalization</h1>
                <p class="subtitle">Customize your desktop appearance.</p>

                <div class="section">
                    <div class="section-title">Background color</div>

                    <div class="color-picker-container">
                        <input type="color" id="backgroundColor" class="color-picker" value="#191919">
                        <span class="color-value" id="colorValue">RGB(25, 25, 25)</span>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Wallpaper effects</div>

                    <div class="slider-container">
                        <div class="slider-top">
                            <span class="slider-label">Background blur</span>
                            <span class="slider-number" id="blurValue">0%</span>
                        </div>

                        <input type="range" min="0" max="100" value="0"
                               id="blurSlider" class="blur-slider">
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Installed wallpapers</div>
                    <div class="wallpaper-grid" id="wallpaperGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- APP STORE WINDOW -->

    <div class="app-window" id="storeWindow">

        <div class="titlebar" id="storeTitlebar">
            <div class="window-title">AppStore</div>

            <div class="window-controls">
                <button class="window-control" onclick="minimizeWindow('storeWindow')" title="Minimize">−</button>
                <button class="window-control" id="storeMaxButton" onclick="maximizeWindow('storeWindow')" title="Maximize">
                    <span class="maximize-icon" id="storeMaxIcon"></span>
                </button>
                <button class="window-control close" onclick="closeWindow('storeWindow')" title="Close">×</button>
            </div>
        </div>

        <div class="window-body">
            <div class="sidebar">
                <h2>AppStore</h2>
                <button class="side-button active" id="wallpapersTab" onclick="showStoreTab('wallpapers')">Wallpapers</button>
                <button class="side-button" id="appsTab" onclick="showStoreTab('apps')">Apps</button>
            </div>

            <div class="content">
                <div id="storeWallpapers">
                    <div class="store-heading">
                        <div>
                            <h1>Wallpapers</h1>
                            <p class="subtitle">Find a new look for your desktop.</p>
                        </div>
                    </div>

                    <div class="store-grid" id="storeGrid"></div>
                </div>

                <div id="storeApps" style="display:none">
                    <h1>Apps</h1>
                    <p class="subtitle">Browse available apps.</p>
                    <div class="store-empty">No Apps yet.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TASKBAR -->

    <div class="taskbar">
        <div class="taskbar-right">
            <button class="settings-button" onclick="openSettings()" title="Settings">⚙</button>

            <div class="clock">
                <div class="time" id="time">00:00</div>
                <div id="date">00/00/0000</div>
            </div>
        </div>
    </div>

</div>

<script>

/* ELEMENTS */

const desktop = document.getElementById("desktop");
const wallpaperLayer = document.getElementById("wallpaperLayer");
const colorPicker = document.getElementById("backgroundColor");
const blurSlider = document.getElementById("blurSlider");
const wallpaperGrid = document.getElementById("wallpaperGrid");
const storeGrid = document.getElementById("storeGrid");

let wallpapers = [];

let currentWallpaper = localStorage.getItem("desktopWallpaper");
let currentColor = localStorage.getItem("desktopColor") || "#191919";
let currentBlur = Number(localStorage.getItem("desktopBlur") ?? 0);

let installedWallpapers = [];

try {
    installedWallpapers = JSON.parse(
        localStorage.getItem("installedWallpapers") || '["Windows_11.jpg"]'
    );
} catch {
    installedWallpapers = ["Windows_11.jpg"];
}

if (!Array.isArray(installedWallpapers)) {
    installedWallpapers = ["Windows_11.jpg"];
}

if (!installedWallpapers.includes("Windows_11.jpg")) {
    installedWallpapers.unshift("Windows_11.jpg");
}

let windowStates = {};
let previewTimers = new Map();


/* CLOCK */

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString();
}

setInterval(updateClock, 1000);
updateClock();


/* WINDOW CONTROLS */

function getWindowElements(id) {
    return {
        window: document.getElementById(id),
        titlebar: document.getElementById(
            id === "settingsWindow" ? "settingsTitlebar" : "storeTitlebar"
        ),
        icon: document.getElementById(
            id === "settingsWindow" ? "settingsMaxIcon" : "storeMaxIcon"
        )
    };
}

function openWindow(id) {
    const elements = getWindowElements(id);
    const win = elements.window;

    win.classList.add("open");

    if (windowStates[id]?.maximized) {
        windowStates[id].maximized = false;
        updateMaximizeIcon(id);
    }

    win.style.left = "50%";
    win.style.top = "50%";
    win.style.width = "720px";
    win.style.height = "550px";
    win.style.transform = "translate(-50%, -50%)";
    win.style.borderRadius = "9px";
}

function openSettings() {
    openWindow("settingsWindow");
    renderWallpapers();
}

function openStore() {
    openWindow("storeWindow");
    renderStore();
}

function closeWindow(id) {
    document.getElementById(id).classList.remove("open");
    if (id === "settingsWindow") stopAllPreviews();
}

function minimizeWindow(id) {
    closeWindow(id);
}

function updateMaximizeIcon(id) {
    const elements = getWindowElements(id);
    const maximized = windowStates[id]?.maximized;

    elements.icon.className = maximized ? "restore-icon" : "maximize-icon";
}

function maximizeWindow(id) {
    const win = document.getElementById(id);

    if (!windowStates[id]) {
        windowStates[id] = { maximized: false, previous: null };
    }

    const state = windowStates[id];

    if (!state.maximized) {
        const rect = win.getBoundingClientRect();

        state.previous = {
            left: rect.left,
            top: rect.top,
            width: rect.width,
            height: rect.height
        };

        win.style.transform = "none";
        win.style.left = rect.left + "px";
        win.style.top = rect.top + "px";
        win.style.width = rect.width + "px";
        win.style.height = rect.height + "px";

        requestAnimationFrame(() => {
            win.style.left = "0px";
            win.style.top = "0px";
            win.style.width = "100vw";
            win.style.height = "calc(100dvh - 52px)";
            win.style.borderRadius = "0px";
        });

        state.maximized = true;
    } else {
        if (!state.previous) return;

        win.style.left = state.previous.left + "px";
        win.style.top = state.previous.top + "px";
        win.style.width = state.previous.width + "px";
        win.style.height = state.previous.height + "px";
        win.style.borderRadius = "9px";

        state.maximized = false;
    }

    updateMaximizeIcon(id);
}


/* WINDOW DRAGGING */

function setupDragging(id) {
    const elements = getWindowElements(id);
    const win = elements.window;
    const titlebar = elements.titlebar;

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startLeft = 0;
    let startTop = 0;

    titlebar.addEventListener("pointerdown", function(e) {
        if (e.target.closest(".window-controls")) return;
        if (windowStates[id]?.maximized || e.button !== 0) return;

        const rect = win.getBoundingClientRect();

        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left;
        startTop = rect.top;

        win.style.left = rect.left + "px";
        win.style.top = rect.top + "px";
        win.style.transform = "none";
        win.style.transition = "none";

        titlebar.setPointerCapture(e.pointerId);
    });

    titlebar.addEventListener("pointermove", function(e) {
        if (!dragging) return;

        const maxX = window.innerWidth - win.offsetWidth;
        const maxY = window.innerHeight - 52 - 43;

        const x = Math.max(0, Math.min(maxX, startLeft + e.clientX - startX));
        const y = Math.max(0, Math.min(maxY, startTop + e.clientY - startY));

        win.style.left = x + "px";
        win.style.top = y + "px";
    });

    function stopDragging() {
        if (!dragging) return;
        dragging = false;
        win.style.transition = "";
    }

    titlebar.addEventListener("pointerup", stopDragging);
    titlebar.addEventListener("pointercancel", stopDragging);
}

setupDragging("settingsWindow");
setupDragging("storeWindow");


/* WALLPAPER HELPERS */

function getWallpaperName(filename) {
    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");
}

function getWallpaperPath(filename) {
    return "Wallpaper/" +
        filename.split("/").map(part => encodeURIComponent(part)).join("/");
}

function isVideo(filename) {
    return /\.(mp4|webm)$/i.test(filename);
}

function saveInstalledWallpapers() {
    localStorage.setItem(
        "installedWallpapers",
        JSON.stringify(installedWallpapers)
    );
}


/* DESKTOP WALLPAPER */

function setWallpaper(filename) {
    if (!installedWallpapers.includes(filename)) return;

    currentWallpaper = filename;
    wallpaperLayer.innerHTML = "";

    const wallpaper = document.createElement(
        isVideo(filename) ? "video" : "img"
    );

    wallpaper.src = getWallpaperPath(filename);

    if (isVideo(filename)) {
        wallpaper.autoplay = true;
        wallpaper.muted = true;
        wallpaper.loop = true;
        wallpaper.playsInline = true;
        wallpaper.play().catch(() => {});
    } else {
        wallpaper.alt = getWallpaperName(filename);
    }

    wallpaperLayer.appendChild(wallpaper);

    localStorage.setItem("desktopWallpaper", filename);
    renderWallpapers();
    renderStore();
}


/* SOLID COLOR BACKGROUND */

function useSolidColor() {
    currentWallpaper = "__solid__";
    wallpaperLayer.innerHTML = "";

    localStorage.setItem("desktopWallpaper", "__solid__");

    renderWallpapers();
    renderStore();
}


/* COLOR */

function applyColor(color) {
    if (!/^#[0-9a-f]{6}$/i.test(color)) return;

    currentColor = color;
    desktop.style.backgroundColor = color;
    colorPicker.value = color;

    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);

    document.getElementById("colorValue").textContent =
        `RGB(${r}, ${g}, ${b})`;

    localStorage.setItem("desktopColor", color);
}

colorPicker.addEventListener("input", function() {
    applyColor(colorPicker.value);
    useSolidColor();
});


/* BLUR */

function applyBlur(value) {
    currentBlur = Number(value);

    wallpaperLayer.style.setProperty(
        "--wallpaper-blur",
        (currentBlur * 0.3) + "px"
    );

    blurSlider.value = currentBlur;

    document.getElementById("blurValue").textContent =
        currentBlur + "%";

    localStorage.setItem("desktopBlur", currentBlur);
}

blurSlider.addEventListener("input", function() {
    applyBlur(blurSlider.value);
});


/* VIDEO PREVIEWS */

function stopPreview(video) {
    video.pause();
    video.removeAttribute("src");
    video.load();
}

function stopAllPreviews() {
    previewTimers.forEach(timer => clearTimeout(timer));
    previewTimers.clear();

    wallpaperGrid.querySelectorAll("video").forEach(video => {
        stopPreview(video);
    });
}

function createPreview(filename) {
    if (isVideo(filename)) {
        const video = document.createElement("video");

        video.className = "wallpaper-preview";
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "none";

        return video;
    }

    const image = document.createElement("img");

    image.className = "wallpaper-preview";
    image.src = getWallpaperPath(filename);
    image.alt = getWallpaperName(filename);

    return image;
}

function addPreviewEvents(card, preview, filename) {
    if (!isVideo(filename)) return;

    card.addEventListener("mouseenter", function() {
        const timer = setTimeout(() => {
            if (!settingsWindow.classList.contains("open")) return;

            preview.src = getWallpaperPath(filename);
            preview.load();
            preview.play().catch(() => {});
            previewTimers.delete(preview);
        }, 500);

        previewTimers.set(preview, timer);
    });

    card.addEventListener("mouseleave", function() {
        const timer = previewTimers.get(preview);

        if (timer) {
            clearTimeout(timer);
            previewTimers.delete(preview);
        }

        stopPreview(preview);
    });
}


/* SETTINGS WALLPAPER LIST */

function renderWallpapers() {
    wallpaperGrid.innerHTML = "";

    const installed = wallpapers.filter(filename =>
        installedWallpapers.includes(filename)
    );

    if (!installed.length) {
        wallpaperGrid.innerHTML =
            '<div class="empty-message">No wallpapers installed.</div>';
        return;
    }

    installed.forEach(filename => {
        const card = document.createElement("div");

        card.className = "wallpaper-card" +
            (currentWallpaper === filename ? " selected" : "");

        const preview = createPreview(filename);

        const name = document.createElement("div");
        name.className = "wallpaper-name";
        name.textContent = getWallpaperName(filename);

        card.append(preview, name);

        if (isVideo(filename)) {
            addPreviewEvents(card, preview, filename);
        }

        card.addEventListener("click", function() {
            setWallpaper(filename);
        });

        wallpaperGrid.appendChild(card);
    });
}


/* APP STORE */

function renderStore() {
    storeGrid.innerHTML = "";

    const available = wallpapers.filter(filename =>
        filename !== "Windows_11.jpg"
    );

    if (!available.length) {
        storeGrid.innerHTML =
            '<div class="store-empty">No wallpapers available.</div>';
        return;
    }

    available.forEach(filename => {
        const card = document.createElement("div");
        card.className = "store-card";

        const preview = document.createElement(
            isVideo(filename) ? "video" : "img"
        );

        preview.className = "store-card-preview";

        if (isVideo(filename)) {
            preview.muted = true;
            preview.loop = true;
            preview.playsInline = true;
            preview.preload = "metadata";
        }

        preview.src = getWallpaperPath(filename);

        const info = document.createElement("div");
        info.className = "store-card-info";

        const name = document.createElement("div");
        name.className = "store-card-name";
        name.textContent = getWallpaperName(filename);

        const bottom = document.createElement("div");
        bottom.className = "store-card-bottom";

        const button = document.createElement("button");
        button.className = "install-button";

        if (installedWallpapers.includes(filename)) {
            button.textContent = "Installed";
            button.disabled = true;
            button.className += " installed";
        } else {
            button.textContent = "Install";

            button.addEventListener("click", function() {
                installWallpaper(filename, button);
            });
        }

        bottom.appendChild(button);
        info.append(name, bottom);
        card.append(preview, info);
        storeGrid.appendChild(card);
    });
}

function installWallpaper(filename, button) {
    if (installedWallpapers.includes(filename)) return;

    button.disabled = true;
    button.textContent = "Installing...";

    const installTime = 200 + Math.random() * 400;

    setTimeout(() => {
        installedWallpapers.push(filename);
        saveInstalledWallpapers();

        button.textContent = "Installed";
        button.disabled = true;

        renderWallpapers();
        renderStore();
    }, installTime);
}

function showStoreTab(tab) {
    const wallpapersTab = document.getElementById("wallpapersTab");
    const appsTab = document.getElementById("appsTab");

    const wallpapersPage = document.getElementById("storeWallpapers");
    const appsPage = document.getElementById("storeApps");

    wallpapersPage.style.display = tab === "wallpapers" ? "block" : "none";
    appsPage.style.display = tab === "apps" ? "block" : "none";

    wallpapersTab.classList.toggle("active", tab === "wallpapers");
    appsTab.classList.toggle("active", tab === "apps");
}


/* LOAD WALLPAPER CATALOG */

async function loadWallpapers() {
    try {
        const response = await fetch("wallpapers.json");

        if (!response.ok) {
            throw new Error("Could not load wallpapers.json");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Wallpaper list must be an array");
        }

        wallpapers = data.filter(filename =>
            typeof filename === "string" &&
            /\.(mp4|webm|jpg|jpeg|png|webp)$/i.test(filename)
        );

        if (!wallpapers.includes("Windows_11.jpg")) {
            wallpapers.unshift("Windows_11.jpg");
        }

        // Windows 11 is the only wallpaper installed automatically.
        installedWallpapers = installedWallpapers.filter(filename =>
            wallpapers.includes(filename)
        );

        if (!installedWallpapers.includes("Windows_11.jpg")) {
            installedWallpapers.unshift("Windows_11.jpg");
        }

        saveInstalledWallpapers();

        // First visit: use Windows 11.
        if (currentWallpaper === null) {
            setWallpaper("Windows_11.jpg");
        } else if (currentWallpaper === "__solid__") {
            wallpaperLayer.innerHTML = "";
        } else if (
            installedWallpapers.includes(currentWallpaper) &&
            wallpapers.includes(currentWallpaper)
        ) {
            setWallpaper(currentWallpaper);
        } else {
            setWallpaper("Windows_11.jpg");
        }

        renderWallpapers();
        renderStore();

    } catch (error) {
        wallpaperGrid.innerHTML =
            '<div class="empty-message">Unable to load wallpapers. Check wallpapers.json.</div>';

        storeGrid.innerHTML =
            '<div class="store-empty">Unable to load the wallpaper catalog.</div>';

        console.error(error);
    }
}


/* INITIAL SETTINGS */

applyColor(currentColor);
applyBlur(currentBlur);

if (currentWallpaper === "__solid__") {
    wallpaperLayer.innerHTML = "";
}

loadWallpapers();

</script>
