<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGames</title>
<style>
:root {
    --bg: rgb(2, 2, 2);
    --ink: #f2f2f2;
    --muted: #8d8d8d;
    --accent: #00c3e3;
    --big: 280px;
    --small: 170px;
}
* { box-sizing: border-box; }
html, body {
    height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; user-select: none;
}
.home { position: relative; height: 100%; display: flex; flex-direction: column; }

/* top bar: search and clock */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px 0; gap: 16px; }
.search {
    width: min(420px, 46vw); height: 38px; padding: 0 16px; border-radius: 6px; outline: none;
    border: 1px solid #2c2c2c; background: #111; color: var(--ink); font-size: 14px; user-select: text;
}
.search::placeholder { color: #777; }
.search:focus { border-color: var(--accent); }
.status { justify-self: end; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; }

/* the carousel: big game in the middle, the others to the left and right */
.stage { position: relative; z-index: 0; isolation: isolate; flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.tile {
    position: absolute; left: 50%; top: 50%;
    width: var(--small); height: var(--small);
    transform: translate(calc(-50% + var(--x, 0px)), -50%);
    border-radius: 4px; overflow: hidden; cursor: pointer;
    background: var(--c, #222); filter: brightness(.55);
    box-shadow: 0 4px 14px #000a;
    transition: transform .28s cubic-bezier(.2,.8,.2,1), width .28s ease, height .28s ease, filter .2s ease, opacity .2s ease, box-shadow .2s ease;
}
.tile:hover { filter: brightness(.8); }
.tile.sel {
    width: var(--big); height: var(--big); filter: none;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent), 0 14px 34px #000c;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.tile .fallback {
    position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 12px; color: #fff;
    font-weight: 700; font-size: 15px; line-height: 1.15; word-break: break-word;
    background: linear-gradient(160deg, #ffffff22 0, transparent 55%), var(--c, #2b2b2b);
}

/* title under the big game */
.caption { text-align: center; padding: 6px 20px 28px; min-height: 64px; }
.caption h1 { margin: 0; font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* running game */
.player { position: absolute; inset: 0; background: #000; display: none; z-index: 100; }
.home.playing .top, .home.playing .stage, .home.playing .caption { visibility: hidden; }
.player.on { display: block; }
.player iframe { width: 100%; height: 100%; border: 0; background: #000; }
.player .home-btn {
    position: absolute; top: 10px; left: 10px; z-index: 2; width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: #000a; color: #fff; font-size: 16px; line-height: 1; cursor: pointer; opacity: .55; transition: opacity .15s;
}
.player .home-btn:hover, .player .home-btn:focus-visible { opacity: 1; }

@media (max-width: 620px) { .top { grid-template-columns: 1fr auto; } .top > div:first-child { display: none; } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="home" id="home">
    <div class="top">
        <div></div>
        <input class="search" id="search" type="search" placeholder="Search..." autocomplete="off" spellcheck="false">
        <div class="status"><span id="clock"></span></div>
    </div>

    <div class="stage" id="stage"></div>

    <div class="caption">
        <h1 id="gameTitle"></h1>
    </div>


    <div class="player" id="player">
        <button class="home-btn" id="homeBtn" aria-label="Back">&#10005;</button>
        <iframe id="gameFrame" allow="fullscreen; autoplay; gamepad" title="Game"></iframe>
    </div>
</div>

<script>
(function () {
    "use strict";

    var NAMES = ["cover", "small", "icon", "big"];       // file names tried when a cover path doesn't load
    var EXTS = ["png", "jpg", "jpeg", "webp"];

    var all = [];          // every game from NGames.json
    var view = [];         // games matching the search box
    var tiles = [];
    var index = 0;
    var BIG = 280, SMALL = 170;

    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), titleEl = $("gameTitle"), homeEl = $("home");
    var player = $("player"), frame = $("gameFrame"), search = $("search"), root = document.documentElement;

    /* clock */
    function tick() {
        var d = new Date(), h = d.getHours() % 12 || 12, m = String(d.getMinutes()).padStart(2, "0");
        $("clock").textContent = h + ":" + m + (d.getHours() < 12 ? " AM" : " PM");
    }
    tick(); setInterval(tick, 20000);

    /* ---------- games + covers ---------- */

    function prettify(s) { return String(s).replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim(); }
    function dirOf(url) { var i = url.lastIndexOf("/"); return i > -1 ? url.slice(0, i + 1) : ""; }
    function isAbsolute(p) { return /^(https?:)?\/\//i.test(p) || /^data:/i.test(p); }

    // accepts objects ({id,title,url,cover,color,icon}) or plain folder names ("Game123")
    function normalize(item) {
        if (typeof item === "string") item = { id: item };
        if (!item || typeof item !== "object") return null;
        var id = item.id || item.folder;
        if (!id) return null;
        var g = {};
        for (var k in item) g[k] = item[k];
        g.id = String(id);
        g.title = item.title || prettify(id);
        g.url = item.url || ("NGames/" + id + "/index.html");
        return g;
    }

    // every place a cover could be, best guess first
    function candidates(g) {
        var out = [], dir = dirOf(g.url);
        function add(u) { if (u && out.indexOf(u) === -1) out.push(u); }

        [g.cover, g.icon, g.image, g.img, g.thumb].forEach(function (p) {
            if (!p || typeof p !== "string") return;
            if (p.charAt(0) === "/") {                                                       // "/NGames/x.png" breaks on GitHub Pages,
                add(p.slice(1)); add(encodeURI(p.slice(1)));                                  // so try it without the slash first
                add(p); add(encodeURI(p));
            } else {
                add(p); add(encodeURI(p));
                if (!isAbsolute(p)) { add(dir + p); add(encodeURI(dir + p)); }                // "cover.png" next to the game
            }
        });
        NAMES.forEach(function (n) {
            [n, n.charAt(0).toUpperCase() + n.slice(1)].forEach(function (name) {
                EXTS.forEach(function (e) { add(dir + name + "." + e); });
            });
        });
        return out;
    }

    // find the first cover that actually loads, then put it on the tile
    function loadCover(g) {
        if (g.imgState) return;
        g.imgState = "loading";
        var list = candidates(g), i = 0;
        (function next() {
            if (i >= list.length) { g.imgState = "none"; return; }
            var url = list[i++], im = new Image();
            im.onload = function () {
                g.img = url; g.imgState = "done";
                if (g.tile) showCover(g);
            };
            im.onerror = next;
            im.src = url;
        })();
    }

    function showCover(g) {
        var t = g.tile, fb = t.querySelector(".fallback");
        if (t.querySelector("img")) return;
        var img = document.createElement("img");
        img.alt = g.title; img.src = g.img;
        t.appendChild(img);
        if (fb) fb.remove();
    }

    /* ---------- the carousel ---------- */

    function measure() {
        var h = stage.clientHeight, w = stage.clientWidth;
        BIG = Math.max(130, Math.min(h * 0.8, w * 0.34, 340));
        SMALL = BIG * 0.6;
        root.style.setProperty("--big", BIG + "px");
        root.style.setProperty("--small", SMALL + "px");
    }

    function build() {
        stage.innerHTML = "";
        tiles = [];

        if (!view.length) {
            titleEl.textContent = "";
            return;
        }

        view.forEach(function (g, i) {
            var t = document.createElement("div");
            t.className = "tile";
            t.title = g.title;
            if (g.color) t.style.setProperty("--c", g.color);
            var fb = document.createElement("div");
            fb.className = "fallback"; fb.textContent = g.title;
            t.appendChild(fb);
            g.tile = t;
            if (g.img) showCover(g);
            t.addEventListener("click", function () {
                if (dragged) return;
                if (i === index) play(g); else select(i);
            });
            stage.appendChild(t);
            tiles.push(t);
        });
        measure();
        select(Math.min(index, view.length - 1));
    }

    function layout() {
        var gap = Math.max(12, BIG * 0.06);
        view.forEach(function (g, i) {
            var d = i - index, el = tiles[i];
            if (!el) return;
            var x = 0;
            if (d !== 0) {
                var s = d > 0 ? 1 : -1;
                x = s * (BIG / 2 + gap + SMALL / 2 + (Math.abs(d) - 1) * (SMALL + gap));
            }
            el.style.setProperty("--x", x + "px");
            el.classList.toggle("sel", d === 0);
            el.style.zIndex = d === 0 ? 10 : Math.max(1, 9 - Math.abs(d));
            el.style.opacity = Math.abs(d) > 6 ? "0" : "1";
            el.style.pointerEvents = Math.abs(d) > 6 ? "none" : "";
        });
    }

    function select(i) {
        if (!view.length) return;
        index = Math.max(0, Math.min(view.length - 1, i));
        titleEl.textContent = view[index].title;
        layout();
        for (var n = index - 6; n <= index + 6; n++) if (view[n]) loadCover(view[n]);   // only load covers near the middle
    }

    /* ---------- search ---------- */

    function applySearch() {
        var q = search.value.trim().toLowerCase();
        var keep = view[index];
        view = all.filter(function (g) { return g.title.toLowerCase().indexOf(q) > -1; });
        index = Math.max(0, view.indexOf(keep));
        build();
    }
    search.addEventListener("input", applySearch);

    /* ---------- playing ---------- */

    function play(g) {
        if (!g) return;
        frame.src = g.url; player.classList.add("on"); homeEl.classList.add("playing");
        setTimeout(function () { try { frame.focus(); } catch (e) {} }, 50);
    }
    function home() { player.classList.remove("on"); homeEl.classList.remove("playing"); frame.src = "about:blank"; }
    $("homeBtn").onclick = home;

    /* ---------- input ---------- */

    document.addEventListener("keydown", function (e) {
        if (player.classList.contains("on")) { if (e.key === "Escape") home(); return; }

        var typing = e.target === search;
        if (typing) {
            if (e.key === "Escape") { search.value = ""; applySearch(); search.blur(); return; }
            if (e.key === "Enter") { e.preventDefault(); search.blur(); return; }
            if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && search.value === "") {
                e.preventDefault(); select(index + (e.key === "ArrowRight" ? 1 : -1));
            }
            if (e.key === "ArrowDown") { e.preventDefault(); search.blur(); }
            return;                                         // otherwise let the text box have the key
        }

        if (e.key === "ArrowRight") { select(index + 1); e.preventDefault(); }
        else if (e.key === "ArrowLeft") { select(index - 1); e.preventDefault(); }
        else if (e.key === "Home") select(0);
        else if (e.key === "End") select(view.length - 1);
        else if (e.key === "/") { e.preventDefault(); search.focus(); search.select(); }
        else if (e.key === "Enter" && view[index] && document.activeElement.tagName !== "BUTTON") play(view[index]);
    });

    stage.addEventListener("wheel", function (e) {
        e.preventDefault();
        if (stage.__wait) return;
        stage.__wait = true; setTimeout(function () { stage.__wait = false; }, 120);
        select(index + ((e.deltaY + e.deltaX) > 0 ? 1 : -1));
    }, { passive: false });

    // click-drag / swipe left and right
    var startX = null, dragged = false;
    stage.addEventListener("pointerdown", function (e) { startX = e.clientX; dragged = false; });
    stage.addEventListener("pointermove", function (e) { if (startX !== null && Math.abs(e.clientX - startX) > 8) dragged = true; });
    stage.addEventListener("pointerup", function (e) {
        if (startX === null) return;
        var dx = e.clientX - startX; startX = null;
        if (Math.abs(dx) > 50) select(index + (dx < 0 ? 1 : -1));
        setTimeout(function () { dragged = false; }, 0);
    });
    stage.addEventListener("pointercancel", function () { startX = null; dragged = false; });

    window.addEventListener("resize", function () { measure(); layout(); });

    /* ---------- load the games ---------- */

    fetch("NGames.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
            var list = Array.isArray(data) ? data : (data && data.games) || [];
            all = list.map(normalize).filter(Boolean);
            view = all.slice();
            build();

            var want = new URLSearchParams(location.search).get("play");
            if (want) {
                var i = view.findIndex(function (g) { return g.id === want; });
                if (i > -1) { select(i); play(view[i]); }
            }
        })
        .catch(function () {
            console.error("Could not load NGames.json");
        });
})();
</script>
</body>
</html>
